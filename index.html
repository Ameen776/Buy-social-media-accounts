<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Social Accounts Market - النسخة النهائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #fff;
            --neon: #00d4ff;
            --purple: #9b59b6;
        }
        body { background: var(--bg); color: var(--text); padding-bottom: 70px; }
        .app { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #111; position: sticky; top: 0; z-index: 99; }
        /* ترتيب الأزرار: الملف الشخصي في أقصى اليمين، القائمة في أقصى اليسار */
        .header-right { display: flex; gap: 16px; align-items: center; }
        .header-left { display: flex; gap: 16px; align-items: center; }
        .menu-btn, .profile-icon { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        .logo { font-size: 1.4rem; font-weight: bold; background: linear-gradient(45deg,#9b59b6,#00d4ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
        
        /* sidebar */
        .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #111; z-index: 1000; transition: 0.3s; padding: 20px; border-left: 1px solid #333; }
        .sidebar.open { right: 0; }
        .sidebar button { display: block; width: 100%; text-align: right; padding: 12px; margin: 8px 0; background: none; border: none; color: white; font-size: 16px; cursor: pointer; border-radius: 12px; }
        .sidebar button:hover { background: var(--purple); }
        
        /* bottom nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display: flex; justify-content: space-around; padding: 12px; z-index: 100; }
        .bottom-nav button { background: none; border: none; color: #aaa; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bottom-nav button i { font-size: 24px; }
        .bottom-nav button.active { color: var(--neon); }
        
        /* pages */
        .page { display: none; padding: 20px; }
        .active-page { display: block; }
        
        /* cards */
        .card { background: var(--card); padding: 16px; border-radius: 20px; margin-bottom: 16px; }
        .btn-primary { background: linear-gradient(90deg, var(--purple), var(--neon)); border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 16px; background: #222; color: white; border: none; }
        .image-preview { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .image-preview img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: #1a1a2e; padding: 24px; border-radius: 28px; width: 90%; max-width: 400px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 16px; display: block; cursor: pointer; border: 3px solid var(--neon); }
    </style>
</head>
<body>
<div class="splash" id="splash" style="position:fixed; inset:0; background:#0a0a1a; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:9999;">
    <div style="font-size:48px; font-weight:bold; background:linear-gradient(45deg,#9b59b6,#00d4ff); -webkit-background-clip:text; background-clip:text; color:transparent;">SAM</div>
    <div>Social Accounts Market</div>
</div>

<div class="app" id="app">
    <!-- Sidebar (Hamburger) -->
    <div class="sidebar" id="sidebar">
        <div style="font-size:24px; margin-bottom:30px;">القائمة</div>
        <button data-page="home">🏠 الرئيسية</button>
        <button data-page="my-accounts">📦 حساباتي</button>
        <button data-page="add-account">➕ إضافة حساب</button>
        <button data-page="messages">💬 الرسائل</button>
        <button data-page="support">🛠️ الدعم الفني</button>
        <button data-page="about">ℹ️ عن التطبيق</button>
        <button id="themeBtn">🌙 الوضع الليلي</button>
        <button id="logoutBtn">🚪 تسجيل الخروج</button>
    </div>
    
    <!-- Header مع تبديل الأماكن: الملف الشخصي في اليمين، القائمة في اليسار -->
    <div class="header">
        <div class="header-right">
            <button class="profile-icon" id="profileIcon">👤</button>
        </div>
        <div class="logo">Social Accounts Market</div>
        <div class="header-left">
            <button class="menu-btn" id="menuBtn">☰</button>
        </div>
    </div>
    
    <!-- Pages -->
    <div id="homePage" class="page active-page"><h2>🔥 الحسابات المتاحة</h2><div id="accountsList">جار التحميل...</div></div>
    <div id="myAccountsPage" class="page"><h2>📦 حساباتي</h2><div id="myAccountsList"></div></div>
    
    <!-- Add Account Page (النموذج الكامل) -->
    <div id="addAccountPage" class="page">
        <h2>➕ نشر حساب جديد</h2>
        <form id="addForm">
            <select id="platformSelect" required>
                <option value="">اختر المنصة</option>
                <option value="TikTok">🎵 TikTok</option>
                <option value="Instagram">📸 Instagram</option>
                <option value="YouTube">▶️ YouTube</option>
                <option value="Snapchat">👻 Snapchat</option>
                <option value="Twitter">🐦 Twitter</option>
                <option value="Facebook">📘 Facebook</option>
                <option value="Telegram">✈️ Telegram</option>
            </select>
            <input id="accName" placeholder="اسم الحساب (مثال: @user)" required>
            <input id="followers" placeholder="عدد المتابعين" type="number" required>
            <div style="display: flex; gap: 12px;">
                <input id="price" placeholder="السعر" type="number" required style="flex:1">
                <select id="currency" style="width: auto;">
                    <option value="SAR">🇸🇦 ريال سعودي</option>
                    <option value="YER">🇾🇪 ريال يمني</option>
                    <option value="USD">🇺🇸 دولار أمريكي</option>
                </select>
            </div>
            <input id="accLink" placeholder="رابط الحساب" required>
            <textarea id="desc" placeholder="وصف الحساب (ماذا يميزه؟)"></textarea>
            <label>صور الإثبات (حد أقصى 3 صور)</label>
            <input type="file" id="images" multiple accept="image/*">
            <div id="imagePreview" class="image-preview"></div>
            <button type="submit" class="btn-primary">✅ نشر الحساب</button>
        </form>
    </div>
    
    <div id="profilePage" class="page"><h2>👤 الملف الشخصي</h2><img id="avatarImg" class="profile-avatar" src="https://via.placeholder.com/100"><input type="file" id="avatarUpload" style="display:none"><form id="profileForm"><input id="pName" placeholder="الاسم"><input id="pEmail" placeholder="البريد"><input id="pPhone" placeholder="الهاتف"><input id="pCity" placeholder="المدينة"><input id="pCountry" placeholder="الدولة"><button type="submit">حفظ</button></form><p>🆔 <span id="userId"></span></p></div>
    <div id="messagesPage" class="page"><h2>💬 المحادثات</h2><div id="convList"></div><div id="chatBox" style="display:none"><div id="chatMsgs" style="height:200px; overflow:auto; background:#222; padding:8px; border-radius:16px;"></div><input id="msgInput" placeholder="رسالة..."><button id="sendMsg">إرسال</button><button id="backConv">رجوع</button></div></div>
    <div id="supportPage" class="page"><h2>📞 الدعم الفني</h2><form id="supportForm"><textarea id="supportMsg" placeholder="مشكلتك..."></textarea><input type="file" id="supportImage"><button type="submit">إرسال</button></form></div>
    <div id="aboutPage" class="page"><h2>ℹ️ عن التطبيق</h2><p style="text-align:center;"><i class="fas fa-shield-alt" style="font-size:48px; color:#00d4ff;"></i><br><strong>Social Accounts Market</strong><br>المنصة الأولى لبيع وشراء الحسابات<br><br>تم التطوير بواسطة Ameen Al-Zawahi</p></div>
    
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button data-nav="home"><i class="fas fa-home"></i><span>الرئيسية</span></button>
        <button data-nav="add-account"><i class="fas fa-plus-circle"></i><span>نشر</span></button>
        <button data-nav="messages"><i class="fas fa-comment-dots"></i><span>الدردشات</span></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, orderBy, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyB3mtcnmHD-rPYxLXLFVhg6VPrNMPIetaw",
        authDomain: "selling-accounts-90d8e.firebaseapp.com",
        projectId: "selling-accounts-90d8e",
        storageBucket: "selling-accounts-90d8e.firebasestorage.app",
        messagingSenderId: "433974982968",
        appId: "1:433974982968:web:203c8ee4f0f9c7670e69cd"
    };
    const appFirebase = initializeApp(firebaseConfig);
    const auth = getAuth(appFirebase);
    const db = getFirestore(appFirebase);
    const provider = new GoogleAuthProvider();
    const IMGBB_KEY = "a76371f79ef3069a4103d3493271efb5";
    
    async function uploadToImgBB(file) {
        const fd = new FormData(); fd.append("image", file); fd.append("key", IMGBB_KEY);
        const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.success) throw new Error(data.error?.message);
        return data.data.url;
    }
    
    let currentUser = null;
    
    // Navigation
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId + 'Page').classList.add('active-page');
        if (pageId === 'home') loadAccounts();
        if (pageId === 'my-accounts') loadMyAccounts();
        if (pageId === 'messages') { document.getElementById('chatBox').style.display = 'none'; document.getElementById('convList').style.display = 'block'; loadConversations(); }
        document.querySelectorAll('.bottom-nav button').forEach(btn => {
            if (btn.dataset.nav === pageId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        document.getElementById('sidebar').classList.remove('open');
    }
    
    // Load accounts
    async function loadAccounts() {
        const container = document.getElementById('accountsList');
        container.innerHTML = 'جار التحميل...';
        const q = query(collection(db, 'accounts'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        if (snap.empty) { container.innerHTML = '<div>لا توجد حسابات</div>'; return; }
        let html = '';
        snap.forEach(d => {
            const acc = d.data();
            html += `<div class="card"><h3>${acc.name}</h3><p>${acc.platform} | ${acc.followers} متابع</p><p>💰 ${acc.price} ${acc.currency}</p><button class="contact-seller btn-outline" data-seller="${acc.sellerId}">📩 مراسلة</button></div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('.contact-seller').forEach(btn => btn.onclick = async () => {
            if (!currentUser) return alert("تسجيل الدخول مطلوب");
            const sellerId = btn.dataset.seller;
            if (sellerId === currentUser.uid) return alert("لا يمكن مراسلة نفسك");
            const convId = [currentUser.uid, sellerId].sort().join('_');
            const convRef = doc(db, 'conversations', convId);
            if (!(await getDoc(convRef)).exists()) await setDoc(convRef, { participants: [currentUser.uid, sellerId], updatedAt: Date.now() });
            showPage('messages');
            setTimeout(() => loadConversation(convId), 200);
        });
    }
    
    async function loadMyAccounts() {
        if (!currentUser) return;
        const q = query(collection(db, 'accounts'), where('sellerId', '==', currentUser.uid));
        const snap = await getDocs(q);
        const container = document.getElementById('myAccountsList');
        if (snap.empty) { container.innerHTML = '<div>لا توجد حسابات</div>'; return; }
        let html = '';
        snap.forEach(d => {
            const acc = d.data();
            html += `<div class="card"><h3>${acc.name}</h3><p>${acc.price} ${acc.currency}</p><button class="edit-price" data-id="${d.id}" data-price="${acc.price}">تعديل السعر</button><button class="delete-acc" data-id="${d.id}">حذف</button></div>`;
        });
        container.innerHTML = html;
        document.querySelectorAll('.edit-price').forEach(btn => btn.onclick = async () => {
            const newPrice = prompt("السعر الجديد", btn.dataset.price);
            if (newPrice) await updateDoc(doc(db, 'accounts', btn.dataset.id), { price: parseFloat(newPrice) });
            loadMyAccounts();
        });
        document.querySelectorAll('.delete-acc').forEach(btn => btn.onclick = async () => {
            if (confirm("حذف؟")) { await deleteDoc(doc(db, 'accounts', btn.dataset.id)); loadMyAccounts(); }
        });
    }
    
    // Messaging
    function getKey(u1, u2) { return CryptoJS.SHA256(u1+u2+"KEY").toString(); }
    function encrypt(m,k) { return CryptoJS.AES.encrypt(m,k).toString(); }
    function decrypt(c,k) { return CryptoJS.AES.decrypt(c,k).toString(CryptoJS.enc.Utf8); }
    async function loadConversations() {
        if (!currentUser) return;
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        onSnapshot(q, async (snap) => {
            const container = document.getElementById('convList');
            if (snap.empty) { container.innerHTML = '<div>لا توجد محادثات</div>'; return; }
            let html = '';
            for (const docSnap of snap.docs) {
                const conv = docSnap.data();
                const otherId = conv.participants.find(id => id !== currentUser.uid);
                const userSnap = await getDoc(doc(db, 'users', otherId));
                const name = userSnap.exists() ? userSnap.data().name : otherId.slice(0,8);
                html += `<div class="card conv-item" data-convid="${docSnap.id}">💬 ${name}</div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('.conv-item').forEach(el => el.onclick = () => loadConversation(el.dataset.convid));
        });
    }
    async function loadConversation(convId) {
        document.getElementById('convList').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
        const parts = convId.split('_');
        const key = getKey(parts[0], parts[1]);
        const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('chatMsgs');
            div.innerHTML = '';
            snap.forEach(msg => {
                const data = msg.data();
                const dec = decrypt(data.encryptedText, key);
                const isMe = data.senderId === currentUser.uid;
                div.innerHTML += `<div style="text-align:${isMe ? 'right' : 'left'}"><span style="background:${isMe ? '#9b59b6' : '#2a2a4a'}; padding:6px 12px; border-radius:18px;">${dec}</span></div>`;
            });
        });
        document.getElementById('sendMsg').onclick = async () => {
            const inp = document.getElementById('msgInput');
            const txt = inp.value.trim();
            if (!txt) return;
            const enc = encrypt(txt, key);
            await setDoc(doc(collection(db, 'conversations', convId, 'messages')), { encryptedText: enc, senderId: currentUser.uid, timestamp: Date.now() });
            inp.value = '';
            await updateDoc(doc(db, 'conversations', convId), { updatedAt: Date.now() });
        };
        document.getElementById('backConv').onclick = () => {
            document.getElementById('chatBox').style.display = 'none';
            document.getElementById('convList').style.display = 'block';
            loadConversations();
        };
    }
    
    // Add account form
    document.getElementById('images')?.addEventListener('change', (e) => {
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = '';
        Array.from(e.target.files).slice(0,3).forEach(f => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            preview.appendChild(img);
        });
    });
    document.getElementById('addForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("تسجيل الدخول مطلوب");
        const files = document.getElementById('images').files;
        if (files.length === 0) return alert("ارفع صورة إثبات");
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = "جاري الرفع...";
        try {
            const urls = [];
            for (let i=0; i<Math.min(files.length,3); i++) urls.push(await uploadToImgBB(files[i]));
            await setDoc(doc(collection(db, 'accounts')), {
                name: document.getElementById('accName').value,
                link: document.getElementById('accLink').value,
                platform: document.getElementById('platformSelect').value,
                followers: parseInt(document.getElementById('followers').value),
                price: parseFloat(document.getElementById('price').value),
                currency: document.getElementById('currency').value,
                description: document.getElementById('desc').value,
                images: urls,
                sellerId: currentUser.uid,
                views: 0,
                createdAt: Date.now()
            });
            alert("تم النشر");
            e.target.reset();
            document.getElementById('imagePreview').innerHTML = '';
            showPage('home');
        } catch(err) { alert("خطأ: "+err.message); }
        finally { btn.disabled = false; btn.textContent = "✅ نشر الحساب"; }
    });
    
    // Profile
    async function loadProfile() {
        if (!currentUser) return;
        const userRef = doc(db, 'users', currentUser.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
            const rid = Math.floor(1e9 + Math.random()*9e9);
            await setDoc(userRef, { userIdRandom: rid, email: currentUser.email, name: currentUser.displayName || '' });
        }
        const data = (await getDoc(userRef)).data();
        document.getElementById('userId').innerText = data?.userIdRandom || currentUser.uid.slice(0,10);
        document.getElementById('pName').value = data?.name || '';
        document.getElementById('pEmail').value = data?.email || currentUser.email;
        document.getElementById('pPhone').value = data?.phone || '';
        if (data?.avatar) document.getElementById('avatarImg').src = data.avatar;
        else if (currentUser.photoURL) document.getElementById('avatarImg').src = currentUser.photoURL;
    }
    document.getElementById('avatarImg')?.addEventListener('click', () => document.getElementById('avatarUpload').click());
    document.getElementById('avatarUpload')?.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file && currentUser) {
            const url = await uploadToImgBB(file);
            await updateDoc(doc(db, 'users', currentUser.uid), { avatar: url });
            document.getElementById('avatarImg').src = url;
            await updateProfile(currentUser, { photoURL: url });
            alert("تم تحديث الصورة");
        }
    });
    document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        await updateDoc(doc(db, 'users', currentUser.uid), {
            name: document.getElementById('pName').value,
            phone: document.getElementById('pPhone').value,
            city: document.getElementById('pCity').value,
            country: document.getElementById('pCountry').value,
            email: document.getElementById('pEmail').value
        });
        alert("تم الحفظ");
    });
    
    // Support
    document.getElementById('supportForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        let imgUrl = '';
        const imgFile = document.getElementById('supportImage').files[0];
        if (imgFile) imgUrl = await uploadToImgBB(imgFile);
        await setDoc(doc(collection(db, 'supportTickets')), {
            userId: currentUser.uid,
            message: document.getElementById('supportMsg').value,
            image: imgUrl,
            timestamp: Date.now()
        });
        alert("تم الإرسال");
        document.getElementById('supportMsg').value = '';
        document.getElementById('supportImage').value = '';
    });
    
    // Theme and logout
    document.getElementById('themeBtn')?.addEventListener('click', () => document.body.classList.toggle('light-mode'));
    document.getElementById('logoutBtn')?.addEventListener('click', () => signOut(auth));
    
    // Auth modal
    function showAuthModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>تسجيل الدخول</h3><input id="loginEmail" placeholder="البريد"><input id="loginPassword" type="password" placeholder="كلمة المرور"><button id="doLogin" class="btn-primary" style="width:100%">دخول</button><button id="doRegister" class="btn-outline" style="width:100%">إنشاء حساب</button><button id="googleLogin" class="btn-outline" style="width:100%"><i class="fab fa-google"></i> Google</button><button id="closeModal" style="background:none;border:none;color:red;margin-top:12px;">إلغاء</button><div id="authErr" style="color:red"></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#doLogin').onclick = async () => {
            try { await signInWithEmailAndPassword(auth, modal.querySelector('#loginEmail').value, modal.querySelector('#loginPassword').value); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#doRegister').onclick = async () => {
            try { await createUserWithEmailAndPassword(auth, modal.querySelector('#loginEmail').value, modal.querySelector('#loginPassword').value); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#googleLogin').onclick = async () => {
            try { await signInWithPopup(auth, provider); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#closeModal').onclick = () => modal.remove();
    }
    
    // Auth state
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const splash = document.getElementById('splash');
        const appDiv = document.getElementById('app');
        if (user) {
            splash.style.opacity = '0'; setTimeout(() => { splash.style.display = 'none'; appDiv.style.display = 'block'; }, 500);
            await loadProfile();
            showPage('home');
            // Bind events after login
            document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('profileIcon').onclick = () => showPage('profile');
            document.querySelectorAll('.sidebar button[data-page]').forEach(btn => btn.onclick = () => showPage(btn.dataset.page));
            document.querySelectorAll('.bottom-nav button').forEach(btn => btn.onclick = () => showPage(btn.dataset.nav));
        } else {
            appDiv.style.display = 'none';
            splash.style.display = 'flex';
            splash.style.opacity = '1';
            setTimeout(showAuthModal, 500);
        }
    });
    setTimeout(() => { if (!currentUser) { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; showAuthModal(); }, 500); } }, 2000);
</script>
</body>
</html>
