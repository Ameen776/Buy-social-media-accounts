<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        body{background:#0f0f1a;color:#fff;padding:20px;}
        .container{max-width:1200px;margin:0 auto;}
        h1{color:#00d4ff;margin-bottom:20px;}
        .btn-primary{background:#00d4ff;border:none;padding:8px 16px;border-radius:30px;color:#111;cursor:pointer;font-weight:bold;}
        .btn-outline{background:transparent;border:1px solid #00d4ff;color:#00d4ff;padding:6px 12px;border-radius:30px;cursor:pointer;}
        .btn-danger{background:#ff4444;border:none;padding:6px 12px;border-radius:30px;color:#fff;cursor:pointer;}
        .accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:20px;}
        .card{background:#1e1e2e;padding:16px;border-radius:16px;border:1px solid #2a2a3a;}
        .card-actions{display:flex;gap:10px;margin-top:15px;}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:10000;}
        .modal-content{background:#1e1e2e;padding:20px;border-radius:16px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;}
        input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a2a;color:#fff;border:1px solid #2a2a3a;}
        .price-currency-row{display:flex;gap:8px;}
        .price-currency-row input{flex:2;}
        .price-currency-row select{width:auto;flex:1;}
        .image-preview{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
        .image-preview img{width:60px;height:60px;border-radius:8px;object-fit:cover;}
        .auth-container{position:fixed;inset:0;background:#0f0f1a;display:flex;align-items:center;justify-content:center;z-index:10001;}
        .auth-card{background:#1e1e2e;border-radius:25px;padding:30px;width:90%;max-width:380px;text-align:center;border:1px solid #00d4ff;}
        .social-icons-row{display:flex;justify-content:center;gap:15px;margin:20px 0;}
        .social-icons-row i{font-size:1.5rem;color:#00d4ff;}
        .auth-switch{margin-top:15px;color:#00d4ff;cursor:pointer;}
        .success-check{color:#00ff88;font-size:2rem;animation:checkPop 0.5s ease;}
        @keyframes checkPop{0%{transform:scale(0);}80%{transform:scale(1.2);}100%{transform:scale(1);}}
        .error-box{background:#ff4444;color:#fff;padding:10px;border-radius:8px;margin:10px 0;display:none;}
        .loading{text-align:center;padding:40px;}
    </style>
</head>
<body>
<div id="authContainer" class="auth-container"></div>

<div id="dashboard" style="display:none;">
    <div class="container">
        <h1>📦 لوحة التحكم - حساباتي المنشورة</h1>
        <div style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap;">
            <button id="refreshBtn" class="btn-outline">🔄 تحديث</button>
            <button id="addBtn" class="btn-primary">➕ إضافة حساب</button>
            <button id="logoutBtn" class="btn-outline">🚪 تسجيل خروج</button>
        </div>
        <div id="errorBox" class="error-box"></div>
        <div id="accountsList" class="loading">جار التحميل...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    // ========== إعدادات Firebase (الخاصة بك) ==========
    const firebaseConfig = {
        apiKey: "AIzaSyB3mtcnmHD-rPYxLXLFVhg6VPrNMPIetaw",
        authDomain: "selling-accounts-90d8e.firebaseapp.com",
        databaseURL: "https://selling-accounts-90d8e-default-rtdb.firebaseio.com",
        projectId: "selling-accounts-90d8e",
        storageBucket: "selling-accounts-90d8e.firebasestorage.app",
        messagingSenderId: "433974982968",
        appId: "1:433974982968:web:203c8ee4f0f9c7670e69cd"
    };
    const IMGBB_KEY = "a76371f79ef3069a4103d3493271efb5";
    
    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    
    async function uploadToImgBB(file) {
        const fd = new FormData();
        fd.append("image", file);
        fd.append("key", IMGBB_KEY);
        const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.success) throw new Error(data.error?.message);
        return data.data.url;
    }
    
    let currentUser = null;
    
    // عرض الأخطاء
    function showError(msg) {
        const box = document.getElementById('errorBox');
        box.innerText = msg;
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 5000);
    }
    
    // تحميل الحسابات المنشورة
    async function loadMyAccounts() {
        if (!currentUser) return;
        const container = document.getElementById('accountsList');
        container.innerHTML = '<div class="loading">جار التحميل...</div>';
        try {
            const q = query(collection(db, 'accounts'), where('sellerId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            console.log("عدد الحسابات:", snap.size);
            if (snap.empty) {
                container.innerHTML = '<div class="card" style="text-align:center;">📭 لا توجد حسابات منشورة. اضغط "إضافة حساب" لنشر حسابك الأول.</div>';
                return;
            }
            let html = '';
            snap.forEach(docSnap => {
                const acc = docSnap.data();
                html += `<div class="card">
                    <h3><i class="fab fa-${acc.platform?.toLowerCase()}"></i> ${acc.name}</h3>
                    <p>${acc.platform} | 👥 ${acc.followers?.toLocaleString()}</p>
                    <p>💰 ${acc.price} ${acc.currency}</p>
                    <p>👁️ ${acc.views || 0} مشاهدة</p>
                    <p>🔗 <a href="${acc.link}" target="_blank" style="color:#00d4ff;">${acc.link}</a></p>
                    <p>📝 ${acc.description || ''}</p>
                    ${acc.images?.[0] ? `<img src="${acc.images[0]}" style="width:100%; height:120px; object-fit:cover; border-radius:10px; margin-top:8px;">` : ''}
                    <div class="card-actions">
                        <button class="edit-btn btn-primary" data-id="${docSnap.id}" data-account='${JSON.stringify(acc)}'>✏️ تعديل</button>
                        <button class="delete-btn btn-danger" data-id="${docSnap.id}">🗑️ حذف</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            
            // ربط أزرار التعديل
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.onclick = () => {
                    const acc = JSON.parse(btn.dataset.account);
                    showEditModal(btn.dataset.id, acc);
                };
            });
            
            // ربط أزرار الحذف
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    if (confirm("هل أنت متأكد من حذف هذا الحساب نهائياً؟")) {
                        await deleteDoc(doc(db, 'accounts', btn.dataset.id));
                        alert("تم حذف الحساب");
                        loadMyAccounts();
                    }
                };
            });
        } catch(e) {
            console.error("خطأ في التحميل:", e);
            container.innerHTML = `<div class="card" style="text-align:center;color:#ff4444;">❌ خطأ في التحميل: ${e.message}<br>تأكد من تفعيل Firestore في مشروع Firebase ومن صحة قواعد الأمان.</div>`;
            showError("فشل التحميل: " + e.message);
        }
    }
    
    // نافذة تعديل الحساب
    async function showEditModal(accountId, currentData) {
        let newImageFiles = [];
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content">
            <h3>✏️ تعديل الحساب</h3>
            <div><label>اسم الحساب</label><input type="text" id="editName" value="${currentData.name.replace(/"/g, '&quot;')}"></div>
            <div><label>رابط الحساب</label><input type="url" id="editLink" value="${currentData.link}"></div>
            <div><label>عدد المتابعين</label><input type="number" id="editFollowers" value="${currentData.followers}"></div>
            <div><label>السعر والعملة</label><div class="price-currency-row"><input type="number" id="editPrice" value="${currentData.price}"><select id="editCurrency"><option ${currentData.currency === 'ريال سعودي' ? 'selected' : ''}>ريال سعودي</option><option ${currentData.currency === 'ريال يمني' ? 'selected' : ''}>ريال يمني</option><option ${currentData.currency === 'دولار' ? 'selected' : ''}>دولار</option></select></div></div>
            <div><label>وصف الحساب</label><textarea id="editDesc">${(currentData.description || '').replace(/"/g, '&quot;')}</textarea></div>
            <div><label>إضافة صور جديدة (اختياري، حد أقصى 3)</label><input type="file" id="editImages" multiple accept="image/*"><div id="editPreview" class="image-preview"></div></div>
            <div style="display:flex; gap:8px; margin-top:15px;"><button class="btn-primary" id="saveEditBtn">💾 حفظ</button><button class="btn-outline" id="cancelEditBtn">إلغاء</button></div>
        </div>`;
        document.body.appendChild(modal);
        const previewDiv = modal.querySelector('#editPreview');
        const imagesInput = modal.querySelector('#editImages');
        imagesInput.addEventListener('change', () => {
            previewDiv.innerHTML = '';
            newImageFiles = Array.from(imagesInput.files).slice(0,3);
            newImageFiles.forEach(f => { const img = document.createElement('img'); img.src = URL.createObjectURL(f); previewDiv.appendChild(img); });
        });
        modal.querySelector('#saveEditBtn').onclick = async () => {
            let imageUrls = currentData.images || [];
            if (newImageFiles.length) {
                const newUrls = [];
                for (let i=0; i<newImageFiles.length; i++) newUrls.push(await uploadToImgBB(newImageFiles[i]));
                imageUrls = [...imageUrls, ...newUrls].slice(0,3);
            }
            await updateDoc(doc(db, 'accounts', accountId), {
                name: modal.querySelector('#editName').value,
                link: modal.querySelector('#editLink').value,
                followers: parseInt(modal.querySelector('#editFollowers').value),
                price: parseFloat(modal.querySelector('#editPrice').value),
                currency: modal.querySelector('#editCurrency').value,
                description: modal.querySelector('#editDesc').value,
                images: imageUrls
            });
            alert("تم التحديث"); modal.remove(); loadMyAccounts();
        };
        modal.querySelector('#cancelEditBtn').onclick = () => modal.remove();
    }
    
    // إضافة حساب جديد
    function showAddModal() {
        let currentImageFiles = [];
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>➕ نشر حساب جديد</h3>
            <form id="addForm">
                <select id="addPlatform" required><option value="">اختر المنصة</option><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Snapchat</option><option>Twitter</option><option>Facebook</option></select>
                <input id="addName" placeholder="اسم الحساب" required>
                <input id="addFollowers" placeholder="عدد المتابعين" type="number" required>
                <div class="price-currency-row"><input id="addPrice" placeholder="السعر" type="number" required><select id="addCurrency"><option>ريال سعودي</option><option>ريال يمني</option><option>دولار</option></select></div>
                <input id="addLink" placeholder="رابط الحساب" required>
                <textarea id="addDesc" placeholder="وصف الحساب"></textarea>
                <label>صور الإثبات (حد أقصى 3)</label><input type="file" id="addImages" multiple accept="image/*"><button type="button" id="addImageBtn" class="btn-outline" style="margin-top:5px;">➕ إضافة صورة أخرى</button>
                <div id="previewImages" class="image-preview"></div>
                <button type="submit" class="btn-primary">نشر</button>
                <button type="button" id="cancelModal" class="btn-outline">إلغاء</button>
            </form></div>`;
        document.body.appendChild(modal);
        const previewDiv = modal.querySelector('#previewImages');
        const imagesInput = modal.querySelector('#addImages');
        function updatePreview() {
            previewDiv.innerHTML = '';
            currentImageFiles.slice(0,3).forEach((file, idx) => {
                const wrapper = document.createElement('div'); wrapper.style.position = 'relative'; wrapper.style.display = 'inline-block'; wrapper.style.margin = '5px';
                const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.style.width = '60px'; img.style.height = '60px'; img.style.borderRadius = '8px';
                const removeBtn = document.createElement('button'); removeBtn.innerHTML = '✖'; removeBtn.style.position = 'absolute'; removeBtn.style.top = '-8px'; removeBtn.style.right = '-8px'; removeBtn.style.background = 'red'; removeBtn.style.border = 'none'; removeBtn.style.borderRadius = '50%'; removeBtn.style.width = '18px'; removeBtn.style.height = '18px'; removeBtn.style.color = 'white'; removeBtn.style.cursor = 'pointer';
                removeBtn.onclick = () => { currentImageFiles.splice(idx,1); updatePreview(); };
                wrapper.appendChild(img); wrapper.appendChild(removeBtn); previewDiv.appendChild(wrapper);
            });
        }
        imagesInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) { if (currentImageFiles.length >= 3) alert("الحد الأقصى 3 صور"); else { currentImageFiles.push(file); updatePreview(); } }
            imagesInput.value = '';
        });
        modal.querySelector('#addImageBtn').onclick = () => imagesInput.click();
        const form = modal.querySelector('#addForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("تسجيل الدخول مطلوب");
            if (currentImageFiles.length === 0) return alert("ارفع صورة واحدة على الأقل");
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = "جاري الرفع...";
            try {
                const urls = [];
                for (let i=0; i<currentImageFiles.length; i++) urls.push(await uploadToImgBB(currentImageFiles[i]));
                await addDoc(collection(db, 'accounts'), {
                    name: document.getElementById('addName').value, link: document.getElementById('addLink').value,
                    platform: document.getElementById('addPlatform').value, followers: parseInt(document.getElementById('addFollowers').value),
                    price: parseFloat(document.getElementById('addPrice').value), currency: document.getElementById('addCurrency').value,
                    description: document.getElementById('addDesc').value, images: urls, sellerId: currentUser.uid,
                    views: 0, createdAt: Date.now()
                });
                alert("تم النشر"); modal.remove(); loadMyAccounts();
            } catch(err) { alert("خطأ: "+err.message); }
            finally { btn.disabled = false; btn.textContent = "نشر"; }
        });
        modal.querySelector('#cancelModal').onclick = () => modal.remove();
    }
    
    // ========== واجهات تسجيل الدخول ==========
    const authContainer = document.getElementById('authContainer');
    function showLoginScreen() {
        authContainer.innerHTML = `<div class="auth-card"><div class="social-icons-row"><i class="fab fa-tiktok"></i><i class="fab fa-instagram"></i><i class="fab fa-youtube"></i><i class="fab fa-snapchat"></i><i class="fab fa-twitter"></i></div><h2>🔐 تسجيل الدخول</h2><input id="loginEmail" placeholder="البريد الإلكتروني"><input id="loginPassword" type="password" placeholder="كلمة المرور"><button id="doLogin" class="btn-primary" style="width:100%;margin-top:10px;">دخول</button><div class="auth-switch" id="toRegister">إنشاء حساب جديد</div><button id="googleLogin" class="btn-outline" style="width:100%;margin-top:10px;"><i class="fab fa-google"></i> Google</button><div id="loginError" style="color:red;margin-top:8px;"></div></div>`;
        document.getElementById('doLogin').onclick = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch(e) { document.getElementById('loginError').innerText = e.message; }
        };
        document.getElementById('toRegister').onclick = () => showRegisterScreen();
        document.getElementById('googleLogin').onclick = async () => { try { await signInWithPopup(auth, provider); } catch(e) { document.getElementById('loginError').innerText = e.message; } };
    }
    
    function showRegisterScreen() {
        authContainer.innerHTML = `<div class="auth-card"><div class="social-icons-row"><i class="fab fa-tiktok"></i><i class="fab fa-instagram"></i><i class="fab fa-youtube"></i><i class="fab fa-snapchat"></i><i class="fab fa-twitter"></i></div><h2>📝 إنشاء حساب</h2><input id="regName" placeholder="الاسم الكامل"><input id="regEmail" placeholder="البريد الإلكتروني"><input id="regPassword" type="password" placeholder="كلمة المرور"><button id="doRegister" class="btn-primary" style="width:100%;margin-top:10px;">إنشاء</button><div class="auth-switch" id="toLogin">تسجيل الدخول</div><div id="regError" style="color:red;"></div></div>`;
        document.getElementById('doRegister').onclick = async () => {
            const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, pass = document.getElementById('regPassword').value;
            if (!name || !email || !pass) { document.getElementById('regError').innerText = "املأ الحقول"; return; }
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: name });
                const rid = Math.floor(1e9 + Math.random()*9e9);
                await setDoc(doc(db, 'users', userCred.user.uid), { userIdRandom: rid, email, name, createdAt: Date.now() });
                document.getElementById('doRegister').innerHTML = '<span class="success-check">✓</span> تم!';
                setTimeout(() => showLoginScreen(), 1500);
            } catch(e) { document.getElementById('regError').innerText = e.message; }
        };
        document.getElementById('toLogin').onclick = () => showLoginScreen();
    }
    
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        if (user) {
            authContainer.style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            await loadMyAccounts();
        } else {
            authContainer.style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            showLoginScreen();
        }
    });
    
    document.getElementById('refreshBtn').onclick = () => loadMyAccounts();
    document.getElementById('addBtn').onclick = () => showAddModal();
    document.getElementById('logoutBtn').onclick = () => signOut(auth);
</script>
</body>
</html>
