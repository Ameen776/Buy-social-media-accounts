    async function loadAccounts() {
        const container = document.getElementById('accountsList');
        container.innerHTML = 'جار التحميل...';
        try {
            const q = query(collection(db, 'accounts'), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            if (snap.empty) { container.innerHTML = `<div>${t('noAccounts')}</div>`; return; }
            let html = '';
            snap.forEach(d => {
                const acc = d.data();
                html += `<div class="card" data-id="${d.id}">
                    <h3><i class="fab fa-${acc.platform?.toLowerCase()}"></i> ${acc.name}</h3>
                    <p>${acc.platform} | 👥 ${acc.followers?.toLocaleString()}</p>
                    <p>💰 ${acc.price} ${acc.currency}</p>
                    ${acc.images?.[0] ? `<img src="${acc.images[0]}" style="width:100%; border-radius:12px; margin-top:8px;">` : ''}
                    <button class="contact-seller btn-outline" data-seller="${acc.sellerId}" data-accid="${d.id}" style="margin-top:8px;">📩 ${t('contact')}</button>
                </div>`;
            });
            container.innerHTML = html;
            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('click', (e) => { if (e.target.classList.contains('contact-seller')) return; const id = card.dataset.id; snap.forEach(d => { if (d.id === id) showAccountDetails(d.data()); }); });
            });
            document.querySelectorAll('.contact-seller').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    if (!currentUser) return alert(t('loginRequired'));
                    const sellerId = btn.dataset.seller;
                    if (sellerId === currentUser.uid) return alert(t('cantMessageSelf'));
                    const convId = [currentUser.uid, sellerId].sort().join('_');
                    const convRef = doc(db, 'conversations', convId);
                    if (!(await getDoc(convRef)).exists()) await setDoc(convRef, { participants: [currentUser.uid, sellerId], updatedAt: Date.now() });
                    showPage('messages');
                    setTimeout(() => loadConversation(convId), 200);
                };
            });
        } catch(e) { container.innerHTML = `<div>${t('error')}</div>`; }
    }

    function getKey(u1, u2) { return CryptoJS.SHA256(u1+u2+"KEY").toString(); }
    function encrypt(m,k) { return CryptoJS.AES.encrypt(m,k).toString(); }
    function decrypt(c,k) { return CryptoJS.AES.decrypt(c,k).toString(CryptoJS.enc.Utf8); }
    
    async function loadConversations() {
        if (!currentUser) return;
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        onSnapshot(q, async (snap) => {
            const container = document.getElementById('convList');
            if (snap.empty) { container.innerHTML = `<div>${t('noConversations')}</div>`; return; }
            let html = '';
            for (const docSnap of snap.docs) {
                const conv = docSnap.data();
                const otherId = conv.participants.find(id => id !== currentUser.uid);
                const userSnap = await getDoc(doc(db, 'users', otherId));
                const name = userSnap.exists() ? userSnap.data().name : otherId.slice(0,8);
                html += `<div class="conversation-item" data-convid="${docSnap.id}">💬 ${name}</div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('.conversation-item').forEach(el => el.onclick = () => loadConversation(el.dataset.convid));
        });
    }
    
    async function loadConversation(convId) {
        document.getElementById('convList').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
        const parts = convId.split('_');
        const key = getKey(parts[0], parts[1]);
        const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('chatMessages');
            div.innerHTML = '';
            snap.forEach(msg => {
                const data = msg.data();
                const dec = decrypt(data.encryptedText, key);
                const isMe = data.senderId === currentUser.uid;
                div.innerHTML += `<div style="text-align:${isMe ? 'right' : 'left'}"><span style="background:${isMe ? '#9b59b6' : '#2a2a4a'}; padding:8px 12px; border-radius:18px; display:inline-block;">${dec}</span></div>`;
            });
            div.scrollTop = div.scrollHeight;
        });
        document.getElementById('sendMsg').onclick = async () => {
            const inp = document.getElementById('messageInput');
            const txt = inp.value.trim();
            if (!txt) return;
            const enc = encrypt(txt, key);
            await setDoc(doc(collection(db, 'conversations', convId, 'messages')), { encryptedText: enc, senderId: currentUser.uid, timestamp: Date.now() });
            inp.value = '';
            await updateDoc(doc(db, 'conversations', convId), { updatedAt: Date.now() });
        };
        document.getElementById('backConv').onclick = () => {
            document.getElementById('chatBox').style.display = 'none';
            document.getElementById('convList').style.display = 'block';
            loadConversations();
        };
    }

                const wrapper = document.createElement('div'); wrapper.style.position = 'relative'; wrapper.style.display = 'inline-block'; wrapper.style.margin = '5px';
                const img = document.createElement('img'); img.src = URL.createObjectURL(file); img.style.width = '80px'; img.style.height = '80px'; img.style.borderRadius = '12px'; img.style.objectFit = 'cover';
                const removeBtn = document.createElement('button'); removeBtn.innerHTML = '✖'; removeBtn.style.position = 'absolute'; removeBtn.style.top = '-8px'; removeBtn.style.right = '-8px'; removeBtn.style.background = 'red'; removeBtn.style.border = 'none'; removeBtn.style.borderRadius = '50%'; removeBtn.style.width = '20px'; removeBtn.style.height = '20px'; removeBtn.style.color = 'white'; removeBtn.style.cursor = 'pointer';
                removeBtn.onclick = () => { currentImageFiles.splice(idx, 1); updatePreview(); };
                wrapper.appendChild(img); wrapper.appendChild(removeBtn); previewDiv.appendChild(wrapper);
            });
        }
        imagesInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) { if (currentImageFiles.length >= 3) alert(t('maxImages')); else { currentImageFiles.push(file); updatePreview(); } }
            imagesInput.value = '';
        });
        modal.querySelector('#addImageBtn').onclick = () => imagesInput.click();
        const form = modal.querySelector('#modalAddForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert(t('loginRequired'));
            if (currentImageFiles.length === 0) return alert(t('uploadAtLeastOne'));
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true; submitBtn.textContent = t('uploading');
            try {
                const urls = [];
                for (let i=0; i<currentImageFiles.length; i++) urls.push(await uploadToImgBB(currentImageFiles[i]));
                await setDoc(doc(collection(db, 'accounts')), {
                    name: modal.querySelector('#modalAccName').value, link: modal.querySelector('#modalLink').value,
                    platform: modal.querySelector('#modalPlatform').value, followers: parseInt(modal.querySelector('#modalFollowers').value),
                    price: parseFloat(modal.querySelector('#modalPrice').value), currency: modal.querySelector('#modalCurrency').value,
                    description: modal.querySelector('#modalDesc').value, images: urls, sellerId: currentUser.uid,
                    views: 0, createdAt: Date.now()

            } catch(err) { alert(t('error')+": "+err.message); }
            finally { submitBtn.disabled = false; submitBtn.textContent = t('publish'); }
        });
        modal.querySelector('#closeModalBtn').onclick = () => modal.remove();
    }

        if (authContainer) authContainer.remove();
        authContainer = document.createElement('div'); authContainer.className = 'auth-container';
        authContainer.innerHTML = `<div class="auth-card"><div class="social-icons-row"><i class="fab fa-tiktok"></i><i class="fab fa-instagram"></i><i class="fab fa-youtube"></i><i class="fab fa-snapchat"></i><i class="fab fa-twitter"></i></div><h2>🔐 ${t('login')}</h2><input type="email" id="loginEmail" placeholder="${t('email')}" autocomplete="email"><input type="password" id="loginPassword" placeholder="${t('password')}" autocomplete="current-password"><button id="doLoginBtn" class="btn-primary" style="width:100%;margin-top:10px;">${t('login')}</button><div class="auth-switch" id="switchToRegister">${t('register')}</div><button id="googleLoginBtn" class="btn-outline" style="width:100%;margin-top:10px;"><i class="fab fa-google"></i> Google</button><div id="loginError" style="color:red;margin-top:10px;"></div></div>`;
        document.body.appendChild(authContainer);
        document.getElementById('doLoginBtn').onclick = async () => {
            const email = document.getElementById('loginEmail').value, pass = document.getElementById('loginPassword').value;
            try { await signInWithEmailAndPassword(auth, email, pass); authContainer.remove(); authContainer=null; } catch(e) { document.getElementById('loginError').innerText = e.message; }
        };
        document.getElementById('switchToRegister').onclick = () => showRegisterScreen();
        document.getElementById('googleLoginBtn').onclick = async () => {
            try { await signInWithPopup(auth, provider); authContainer.remove(); authContainer=null; } catch(e) { document.getElementById('loginError').innerText = e.message; }
        };
    }
    function showRegisterScreen() {
        if (authContainer) authContainer.remove();
        authContainer = document.createElement('div'); authContainer.className = 'auth-container';
        authContainer.innerHTML = `<div class="auth-card"><div class="social-icons-row"><i class="fab fa-tiktok"></i><i class="fab fa-instagram"></i><i class="fab fa-youtube"></i><i class="fab fa-snapchat"></i><i class="fab fa-twitter"></i></div><h2>📝 ${t('register')}</h2><input type="text" id="regName" placeholder="${t('name')}"><input type="email" id="regEmail" placeholder="${t('email')}" autocomplete="email"><input type="password" id="regPassword" placeholder="${t('password')}" autocomplete="new-password"><div class="suggest-password" id="suggestPasswordBtn">🔑 ${t('password')}</div><div id="passwordSuggestionDisplay" class="password-suggestion" style="display:none;"></div><select id="regCountry"><option value="">${t('selectCountry')}</option>${arabCountries.map(c=>`<option>${c}</option>`).join('')}</select><button id="doRegisterBtn" class="btn-primary" style="width:100%;margin-top:10px;">${t('register')}</button><div class="auth-switch" id="switchToLogin">${t('login')}</div><div id="registerError" style="color:red;margin-top:10px;"></div></div>`;
        document.body.appendChild(authContainer);
        const passwordField = document.getElementById('regPassword');
        document.getElementById('suggestPasswordBtn').onclick = () => {
            const strongPass = generateStrongPassword(); passwordField.value = strongPass;
            const disp = document.getElementById('passwordSuggestionDisplay'); disp.style.display = 'block'; disp.innerHTML = `🔐 ${t('password')}: ${strongPass}`; setTimeout(()=>disp.style.display='none',5000);
        };
        document.getElementById('doRegisterBtn').onclick = async () => {
            const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, password = document.getElementById('regPassword').value, country = document.getElementById('regCountry').value;
            if (!name || !email || !password || !country) { document.getElementById('registerError').innerText = t('fillFields'); return; }
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCred.user, { displayName: name });
                const rid = Math.floor(1e9 + Math.random()*9e9);
                await setDoc(doc(db, 'users', userCred.user.uid), { userIdRandom: rid, email, name, country, createdAt: Date.now() });
                const btn = document.getElementById('doRegisterBtn');
                btn.innerHTML = '<span class="success-check">✓</span> ' + t('success');
                btn.disabled = true;
                setTimeout(() => { showLoginScreen(); }, 1500);
            } catch(e) { document.getElementById('registerError').innerText = e.message; }
        };
        document.getElementById('switchToLogin').onclick = () => showLoginScreen();
    }
    
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const splash = document.getElementById('splash');
        const appDiv = document.getElementById('app');
        if (user) {
            splash.style.opacity = '0'; setTimeout(() => { splash.style.display = 'none'; appDiv.style.display = 'block'; }, 500);
            await loadProfile(); populateSelectors(); loadAccounts(); showPage('home');
        } else {
            appDiv.style.display = 'none'; splash.style.display = 'flex'; splash.style.opacity = '1';
            setTimeout(() => { splash.style.display = 'none'; showLoginScreen(); }, 1000);
        }
    });
    setTimeout(() => { if (!currentUser && document.getElementById('splash').style.display !== 'none') { document.getElementById('splash').style.opacity = '0'; setTimeout(() => { document.getElementById('splash').style.display = 'none'; showLoginScreen(); }, 500); } }, 2000);
</script>
</body>
</html>
