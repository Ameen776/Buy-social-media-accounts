<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Social Accounts Market - رفع صور عبر imgbb</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0a1a; color: white; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; padding: 16px; background: #111; position: sticky; top: 0; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; padding: 20px; transition: 0.3s; z-index: 1000; }
        .sidebar.open { left: 0; }
        .sidebar button { display: block; width: 100%; padding: 12px; margin: 8px 0; background: none; border: none; color: white; font-size: 16px; text-align: left; cursor: pointer; }
        .sidebar button:hover { background: #9b59b6; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display: flex; justify-content: space-around; padding: 12px; }
        .bottom-nav button { background: none; border: none; color: white; font-size: 16px; cursor: pointer; padding: 8px; }
        .page { display: none; padding: 20px; }
        .active-page { display: block; }
        .card { background: #1a1a2e; padding: 16px; border-radius: 20px; margin-bottom: 16px; }
        button, .btn { background: linear-gradient(90deg, #9b59b6, #00d4ff); border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; margin: 8px 0; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 16px; background: #222; color: white; border: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: #1a1a2e; padding: 24px; border-radius: 28px; width: 90%; max-width: 400px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; display: block; cursor: pointer; border: 3px solid #00d4ff; }
        .image-preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="splash" id="splash" style="position:fixed; inset:0; background:#0a0a1a; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:9999;">
    <div style="font-size:48px;">SAM</div>
    <div>Social Accounts Market</div>
</div>

<div id="app" style="display:none;">
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
        <div style="font-size:24px; margin-bottom:30px;">القائمة</div>
        <button onclick="window.navigateTo('home')">🏠 الرئيسية</button>
        <button onclick="window.navigateTo('my-accounts')">📦 حساباتي</button>
        <button onclick="window.navigateTo('add-account')">➕ إضافة حساب</button>
        <button onclick="window.navigateTo('messages')">💬 الرسائل</button>
        <button onclick="window.navigateTo('support')">🛠️ الدعم الفني</button>
        <button onclick="window.navigateTo('about')">ℹ️ عن التطبيق</button>
        <button id="themeBtnSide" onclick="document.body.classList.toggle('light-mode')">🌙 الوضع الليلي</button>
        <button id="logoutBtnSide" onclick="window.logout()">🚪 تسجيل الخروج</button>
    </div>
    
    <!-- الهيدر -->
    <div class="header">
        <button class="menu-btn" id="menuBtn" style="background:none; border:none; color:white; font-size:28px; cursor:pointer;">☰</button>
        <div style="font-weight:bold;">Social Accounts Market</div>
        <button class="profile-icon" id="profileIcon" style="background:none; border:none; color:white; font-size:28px; cursor:pointer;" onclick="window.navigateTo('profile')">👤</button>
    </div>
    
    <!-- الصفحات -->
    <div id="homePage" class="page active-page"><h2>🔥 الحسابات المتاحة</h2><div id="accountsList">جار التحميل...</div></div>
    <div id="myAccountsPage" class="page"><h2>📦 حساباتي</h2><div id="myAccountsList"></div></div>
    <div id="addAccountPage" class="page"><h2>➕ إضافة حساب</h2>
        <form id="addForm">
            <input id="accName" placeholder="اسم الحساب" required>
            <input id="accLink" placeholder="رابط الحساب" required>
            <select id="platform">
                <option>TikTok</option><option>Instagram</option><option>YouTube</option>
                <option>Snapchat</option><option>Twitter</option><option>Facebook</option>
            </select>
            <input id="followers" placeholder="عدد المتابعين" type="number" required>
            <input id="price" placeholder="السعر" type="number" required>
            <select id="currency"><option>SAR</option><option>USD</option><option>YER</option></select>
            <textarea id="desc" placeholder="وصف الحساب"></textarea>
            <input type="file" id="images" multiple accept="image/*">
            <div id="imagePreview" class="image-preview"></div>
            <button type="submit">نشر الحساب</button>
        </form>
    </div>
    <div id="profilePage" class="page"><h2>👤 الملف الشخصي</h2>
        <img id="avatarImg" class="profile-avatar" src="https://via.placeholder.com/100">
        <input type="file" id="avatarUpload" accept="image/*" style="display:none">
        <form id="profileForm">
            <input id="pName" placeholder="الاسم">
            <input id="pEmail" placeholder="البريد">
            <input id="pPhone" placeholder="الهاتف">
            <input id="pCity" placeholder="المدينة">
            <input id="pCountry" placeholder="الدولة">
            <input id="pZip" placeholder="الرمز البريدي">
            <button type="submit">حفظ المعلومات</button>
        </form>
        <p>المعرف الفريد: <span id="userId"></span></p>
    </div>
    <div id="messagesPage" class="page"><h2>💬 المحادثات</h2><div id="convList"></div><div id="chatBox" style="display:none"><div id="chatMsgs" style="height:200px; overflow:auto; background:#222; padding:8px; border-radius:16px;"></div><input id="msgInput" placeholder="اكتب رسالة..."><button id="sendMsg">إرسال</button><button id="backConv">رجوع</button></div></div>
    <div id="supportPage" class="page"><h2>📞 الدعم الفني</h2><form id="supportForm"><textarea id="supportMsg" placeholder="اكتب مشكلتك..."></textarea><button type="submit">إرسال</button></form></div>
    <div id="aboutPage" class="page"><h2>ℹ️ عن التطبيق</h2><p>منصة بيع وشراء حسابات التواصل الاجتماعي<br><br>✅ آمن ومضمون<br>⚡ فوري وسريع<br><br>تطوير: Ameen Al-Zawahi</p></div>
    
    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <button onclick="window.navigateTo('home')">🏠 الرئيسية</button>
        <button onclick="window.navigateTo('add-account')">➕ نشر</button>
        <button onclick="window.navigateTo('messages')">💬 الدردشات</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    // ========== Firebase Config ==========
    const firebaseConfig = {
        apiKey: "AIzaSyB3mtcnmHD-rPYxLXLFVhg6VPrNMPIetaw",
        authDomain: "selling-accounts-90d8e.firebaseapp.com",
        projectId: "selling-accounts-90d8e",
        storageBucket: "selling-accounts-90d8e.firebasestorage.app",
        messagingSenderId: "433974982968",
        appId: "1:433974982968:web:203c8ee4f0f9c7670e69cd"
    };
    
    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);
    const provider = new GoogleAuthProvider();
    
    // ========== ImgBB API Key ==========
    const IMGBB_API_KEY = "a76371f79ef3069a4103d3493271efb5";
    
    // ========== دالة رفع الصورة إلى ImgBB ==========
    async function uploadImageToImgBB(file) {
        return new Promise((resolve, reject) => {
            const formData = new FormData();
            formData.append("image", file);
            formData.append("key", IMGBB_API_KEY);
            
            fetch("https://api.imgbb.com/1/upload", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resolve(data.data.url);
                } else {
                    reject(new Error(data.error?.message || "فشل رفع الصورة"));
                }
            })
            .catch(reject);
        });
    }
    
    // ========== رفع صور متعددة ==========
    async function uploadMultipleImages(files, onProgress) {
        const urls = [];
        for (let i = 0; i < files.length; i++) {
            try {
                const url = await uploadImageToImgBB(files[i]);
                urls.push(url);
                if (onProgress) onProgress(i + 1, files.length);
            } catch (err) {
                console.error("خطأ في رفع الصورة:", err);
                throw err;
            }
        }
        return urls;
    }
    
    let currentUser = null;
    
    // ========== دالة التنقل العامة ==========
    window.navigateTo = function(pageId) {
        console.log("تنقل إلى:", pageId);
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        const target = document.getElementById(pageId + 'Page');
        if (target) target.classList.add('active-page');
        
        if (pageId === 'home') loadAccounts();
        if (pageId === 'my-accounts') loadMyAccounts();
        if (pageId === 'messages') loadConversations();
        
        const sidebar = document.getElementById('sidebar');
        if (sidebar) sidebar.classList.remove('open');
    };
    
    window.logout = function() {
        signOut(auth);
    };
    
    // ========== تحميل الحسابات ==========
    async function loadAccounts() {
        const container = document.getElementById('accountsList');
        if (!container) return;
        container.innerHTML = 'جار التحميل...';
        try {
            const q = query(collection(db, 'accounts'), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            if (snap.empty) { container.innerHTML = '<div>لا توجد حسابات للبيع</div>'; return; }
            let html = '';
            snap.forEach(docSnap => {
                const acc = docSnap.data();
                html += `
                    <div class="card">
                        <h3><i class="fab fa-${acc.platform?.toLowerCase()}"></i> ${acc.name}</h3>
                        <p>${acc.platform} | 👥 ${acc.followers?.toLocaleString()} متابع</p>
                        <p>💰 ${acc.price} ${acc.currency}</p>
                        <p>👁️ ${acc.views || 0} مشاهدة</p>
                        ${acc.images && acc.images[0] ? `<img src="${acc.images[0]}" style="width:100%; border-radius:12px; margin:8px 0;" alt="صورة الحساب">` : ''}
                        <button class="contact-btn" data-seller="${acc.sellerId}">📩 مراسلة البائع</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.querySelectorAll('.contact-btn').forEach(btn => {
                btn.onclick = async () => {
                    if (!currentUser) return alert("تسجيل الدخول مطلوب");
                    const sellerId = btn.dataset.seller;
                    if (sellerId === currentUser.uid) return alert("لا يمكن مراسلة نفسك");
                    const convId = [currentUser.uid, sellerId].sort().join('_');
                    const convRef = doc(db, 'conversations', convId);
                    const convSnap = await getDoc(convRef);
                    if (!convSnap.exists()) await setDoc(convRef, { participants: [currentUser.uid, sellerId], updatedAt: Date.now() });
                    window.navigateTo('messages');
                    setTimeout(() => loadConversation(convId), 200);
                };
            });
        } catch(e) { container.innerHTML = '<div>خطأ في التحميل</div>'; console.error(e); }
    }
    
    // ========== حساباتي ==========
    async function loadMyAccounts() {
        if (!currentUser) return;
        const container = document.getElementById('myAccountsList');
        const q = query(collection(db, 'accounts'), where('sellerId', '==', currentUser.uid));
        const snap = await getDocs(q);
        if (snap.empty) { container.innerHTML = '<div>لا توجد حسابات منشورة</div>'; return; }
        let html = '';
        snap.forEach(docSnap => {
            const acc = docSnap.data();
            html += `
                <div class="card">
                    <h3>${acc.name}</h3>
                    <p>السعر: ${acc.price} ${acc.currency}</p>
                    <button class="edit-price" data-id="${docSnap.id}" data-price="${acc.price}">تعديل السعر</button>
                    <button class="delete-acc" data-id="${docSnap.id}">حذف</button>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.edit-price').forEach(btn => {
            btn.onclick = async () => {
                const newPrice = prompt("السعر الجديد", btn.dataset.price);
                if (newPrice) await updateDoc(doc(db, 'accounts', btn.dataset.id), { price: parseFloat(newPrice) });
                loadMyAccounts();
            };
        });
        document.querySelectorAll('.delete-acc').forEach(btn => {
            btn.onclick = async () => { if (confirm("حذف الحساب؟")) { await deleteDoc(doc(db, 'accounts', btn.dataset.id)); loadMyAccounts(); } };
        });
    }
    
    // ========== المحادثات ==========
    async function loadConversations() {
        if (!currentUser) return;
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        const snap = await getDocs(q);
        const container = document.getElementById('convList');
        if (snap.empty) { container.innerHTML = '<div>لا توجد محادثات</div>'; return; }
        let html = '';
        for (const docSnap of snap.docs) {
            const conv = docSnap.data();
            const otherId = conv.participants.find(id => id !== currentUser.uid);
            const userSnap = await getDoc(doc(db, 'users', otherId));
            const name = userSnap.exists() ? userSnap.data().name : otherId.slice(0,8);
            html += `<div class="card conv-item" data-convid="${docSnap.id}">💬 ${name}</div>`;
        }
        container.innerHTML = html;
        document.querySelectorAll('.conv-item').forEach(el => {
            el.onclick = () => loadConversation(el.dataset.convid);
        });
    }
    
    // ========== تشفير المحادثات ==========
    function getKey(uid1, uid2) { return CryptoJS.SHA256(uid1+uid2+'KEY').toString(); }
    function encrypt(msg, key) { return CryptoJS.AES.encrypt(msg, key).toString(); }
    function decrypt(cipher, key) { return CryptoJS.AES.decrypt(cipher, key).toString(CryptoJS.enc.Utf8); }
    
    async function loadConversation(convId) {
        document.getElementById('convList').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
        const participants = convId.split('_');
        const key = getKey(participants[0], participants[1]);
        const msgsRef = collection(db, 'conversations', convId, 'messages');
        const q = query(msgsRef, orderBy('timestamp'));
        const unsub = onSnapshot(q, (snap) => {
            const chatDiv = document.getElementById('chatMsgs');
            chatDiv.innerHTML = '';
            snap.forEach(msgDoc => {
                const data = msgDoc.data();
                const dec = decrypt(data.encryptedText, key);
                const isMe = data.senderId === currentUser.uid;
                chatDiv.innerHTML += `<div style="text-align:${isMe ? 'right' : 'left'}"><span style="background:${isMe ? '#9b59b6' : '#2a2a4a'}; padding:6px 12px; border-radius:18px; display:inline-block;">${dec}</span></div>`;
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });
        window.currentConvId = convId;
        document.getElementById('sendMsg').onclick = async () => {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            const encrypted = encrypt(text, key);
            await setDoc(doc(collection(db, 'conversations', convId, 'messages')), {
                encryptedText: encrypted, senderId: currentUser.uid, timestamp: Date.now()
            });
            input.value = '';
            await updateDoc(doc(db, 'conversations', convId), { updatedAt: Date.now() });
        };
        document.getElementById('backConv').onclick = () => {
            document.getElementById('chatBox').style.display = 'none';
            document.getElementById('convList').style.display = 'block';
            loadConversations();
            unsub();
        };
    }
    
    // ========== الملف الشخصي ==========
    async function loadProfile() {
        if (!currentUser) return;
        const userRef = doc(db, 'users', currentUser.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
            const randomId = Math.floor(1000000000 + Math.random() * 9000000000);
            await setDoc(userRef, { userIdRandom: randomId, email: currentUser.email, name: currentUser.displayName || '' });
        }
        const data = (await getDoc(userRef)).data();
        document.getElementById('userId').innerText = data?.userIdRandom || currentUser.uid.slice(0,10);
        document.getElementById('pName').value = data?.name || '';
        document.getElementById('pEmail').value = data?.email || currentUser.email;
        document.getElementById('pPhone').value = data?.phone || '';
        document.getElementById('pCity').value = data?.city || '';
        document.getElementById('pCountry').value = data?.country || '';
        document.getElementById('pZip').value = data?.zip || '';
        if (data?.avatar) document.getElementById('avatarImg').src = data.avatar;
        else if (currentUser.photoURL) document.getElementById('avatarImg').src = currentUser.photoURL;
    }
    
    // رفع الصورة الشخصية عبر ImgBB
    document.getElementById('avatarImg').onclick = () => document.getElementById('avatarUpload').click();
    document.getElementById('avatarUpload').onchange = async (e) => {
        const file = e.target.files[0];
        if (file && currentUser) {
            const btn = document.getElementById('avatarImg');
            btn.style.opacity = '0.5';
            try {
                const url = await uploadImageToImgBB(file);
                await updateDoc(doc(db, 'users', currentUser.uid), { avatar: url });
                document.getElementById('avatarImg').src = url;
                await updateProfile(currentUser, { photoURL: url });
                alert("تم تحديث الصورة الشخصية");
            } catch(err) { alert("فشل رفع الصورة: " + err.message); }
            finally { btn.style.opacity = '1'; }
        }
    };
    
    document.getElementById('profileForm').onsubmit = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        await updateDoc(doc(db, 'users', currentUser.uid), {
            name: document.getElementById('pName').value,
            phone: document.getElementById('pPhone').value,
            city: document.getElementById('pCity').value,
            country: document.getElementById('pCountry').value,
            zip: document.getElementById('pZip').value,
            email: document.getElementById('pEmail').value
        });
        alert("تم حفظ الملف الشخصي");
    };
    
    // ========== إضافة حساب مع رفع الصور عبر ImgBB ==========
    const imageInput = document.getElementById('images');
    const previewDiv = document.getElementById('imagePreview');
    
    imageInput.addEventListener('change', (e) => {
        previewDiv.innerHTML = '';
        Array.from(e.target.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = document.createElement('img');
                img.src = ev.target.result;
                previewDiv.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });
    
    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("يجب تسجيل الدخول");
        
        const files = document.getElementById('images').files;
        if (files.length === 0) return alert("الرجاء اختيار صورة واحدة على الأقل");
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.textContent = "جاري رفع الصور...";
        submitBtn.disabled = true;
        
        try {
            const imageUrls = await uploadMultipleImages(files);
            
            await setDoc(doc(collection(db, 'accounts')), {
                name: document.getElementById('accName').value,
                link: document.getElementById('accLink').value,
                platform: document.getElementById('platform').value,
                followers: parseInt(document.getElementById('followers').value),
                price: parseFloat(document.getElementById('price').value),
                currency: document.getElementById('currency').value,
                description: document.getElementById('desc').value,
                images: imageUrls,
                sellerId: currentUser.uid,
                views: 0,
                createdAt: Date.now()
            });
            alert("تم نشر الحساب بنجاح!");
            document.getElementById('addForm').reset();
            previewDiv.innerHTML = '';
            window.navigateTo('home');
        } catch(err) {
            alert("خطأ في رفع الصور: " + err.message);
        } finally {
            submitBtn.textContent = "نشر الحساب";
            submitBtn.disabled = false;
        }
    };
    
    // ========== الدعم الفني ==========
    document.getElementById('supportForm').onsubmit = async (e) => {
        e.preventDefault();
        if (!currentUser) return;
        await setDoc(doc(collection(db, 'supportTickets')), {
            userId: currentUser.uid,
            message: document.getElementById('supportMsg').value,
            timestamp: Date.now()
        });
        alert("تم إرسال طلب الدعم");
        document.getElementById('supportMsg').value = '';
    };
    
    // ========== فتح/غلق القائمة الجانبية ==========
    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
    };
    
    // ========== نافذة تسجيل الدخول ==========
    function showAuthModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>🔐 تسجيل الدخول</h3>
                <input id="loginEmail" placeholder="البريد الإلكتروني">
                <input id="loginPassword" type="password" placeholder="كلمة المرور">
                <button id="doLogin">تسجيل الدخول</button>
                <button id="doRegister">إنشاء حساب جديد</button>
                <button id="googleLogin">تسجيل عبر Google</button>
                <button id="closeModal">إلغاء</button>
                <div id="authErr" style="color:red; margin-top:10px;"></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#doLogin').onclick = async () => {
            const email = modal.querySelector('#loginEmail').value;
            const pass = modal.querySelector('#loginPassword').value;
            try { await signInWithEmailAndPassword(auth, email, pass); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#doRegister').onclick = async () => {
            const email = modal.querySelector('#loginEmail').value;
            const pass = modal.querySelector('#loginPassword').value;
            try { await createUserWithEmailAndPassword(auth, email, pass); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#googleLogin').onclick = async () => {
            try { await signInWithPopup(auth, provider); modal.remove(); } catch(e) { modal.querySelector('#authErr').innerText = e.message; }
        };
        modal.querySelector('#closeModal').onclick = () => modal.remove();
    }
    
    // ========== مراقبة حالة المستخدم ==========
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const splashDiv = document.getElementById('splash');
        const appDiv = document.getElementById('app');
        if (user) {
            console.log("✅ تم تسجيل الدخول:", user.email);
            splashDiv.style.opacity = '0';
            setTimeout(() => { splashDiv.style.display = 'none'; appDiv.style.display = 'block'; }, 500);
            await loadProfile();
            window.navigateTo('home');
        } else {
            appDiv.style.display = 'none';
            splashDiv.style.display = 'flex';
            splashDiv.style.opacity = '1';
            setTimeout(showAuthModal, 500);
        }
    });
    
    setTimeout(() => {
        if (!currentUser && document.getElementById('splash').style.display !== 'none') {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => { document.getElementById('splash').style.display = 'none'; showAuthModal(); }, 500);
        }
    }, 2000);
</script>
</body>
</html>
