<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سوق الحسابات - المنصة الاحترافية</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
        :root {
            --bg-body: #0f0f1a;
            --bg-header: #1a1a2a;
            --bg-card: #1e1e2e;
            --text-primary: #fff;
            --text-secondary: #aaa;
            --border-color: #2a2a3a;
            --accent: #00d4ff;
            --follow-green: #2ecc71;
        }
        body.light {
            --bg-body: #f0f0f8;
            --bg-header: #e0e0e8;
            --bg-card: #ffffff;
            --text-primary: #111;
            --text-secondary: #555;
            --border-color: #ccc;
            --accent: #0077b6;
            --follow-green: #27ae60;
        }
        body{background:var(--bg-body);color:var(--text-primary);transition:0.3s;padding-bottom:70px;}
        
        .header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:var(--bg-header);position:sticky;top:0;z-index:99;}
        .menu-btn,.profile-icon{background:none;border:none;color:var(--text-primary);font-size:26px;cursor:pointer;}
        .logo{font-size:1.2rem;font-weight:bold;color:var(--accent);}
        
        .sidebar{position:fixed;top:0;right:-260px;width:260px;height:100%;background:var(--bg-header);transition:0.3s;padding:20px;z-index:1000;border-left:1px solid var(--border-color);overflow-y:auto;}
        .sidebar.open{right:0;}
        .sidebar button{display:block;width:100%;text-align:right;padding:12px;margin:5px 0;background:none;border:none;color:var(--text-primary);font-size:15px;cursor:pointer;border-radius:8px;}
        .sidebar button:hover{background:var(--border-color);}
        
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg-header);display:flex;justify-content:space-around;padding:12px;z-index:100;border-top:1px solid var(--border-color);}
        .bottom-nav button{background:none;border:none;color:#888;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
        .bottom-nav button i{font-size:22px;}
        .bottom-nav button.active{color:var(--accent);}
        
        .page{display:none;padding:15px;}
        .active-page{display:block;}
        
        .accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;}
        .card{background:var(--bg-card);padding:12px;border-radius:14px;border:1px solid var(--border-color);}
        .card h3{font-size:0.95rem;margin-bottom:6px;}
        .card p{font-size:0.7rem;margin:3px 0;color:var(--text-secondary);}
        .profile-thumb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid var(--accent);
        }
        
        .btn-primary{background:var(--accent);border:none;padding:6px 12px;border-radius:25px;color:#111;cursor:pointer;font-weight:bold;font-size:0.7rem;}
        .btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:5px 10px;border-radius:25px;cursor:pointer;font-size:0.7rem;}
        .btn-danger{background:#ff4444;border:none;padding:6px 12px;border-radius:25px;color:#fff;cursor:pointer;font-size:0.7rem;}
        
        .btn-follow-green {
            background: #2ecc71;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            min-width: 110px;
        }
        .btn-follow-green.unfollow { background: #555; }
        
        .filter-row{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
        .filter-row input,.filter-row select{flex:1;padding:8px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border-color);color:var(--text-primary);font-size:0.8rem;}
        input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);}
        
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:center;z-index:10000;}
        .modal-content{background:var(--bg-card);padding:20px;border-radius:16px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;}
        
        .profile-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;display:block;border:2px solid var(--accent);object-fit:cover;}
        .own-profile-avatar{cursor:pointer;}
        .own-profile-avatar:hover{opacity:0.8;}
        .other-profile-avatar{cursor:default;}
        
        .profile-stats-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .profile-stats-inline { display: flex; gap: 25px; }
        .profile-stat{text-align:center;}
        .profile-stat span{display:block;font-size:1.3rem;font-weight:bold;}
        .profile-stat small{font-size:0.8rem;color:var(--text-secondary);}
        
        .my-accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:10px;}
        .my-account-card{background:var(--bg-card);padding:10px;border-radius:12px;border:1px solid var(--border-color);}
        
        .settings-icon{position:absolute;top:5px;left:15px;font-size:22px;cursor:pointer;color:var(--accent);}
        .settings-icon.hidden{display:none;}
        .profile-header{position:relative;}
        
        .chat-messages{height:250px;overflow-y:auto;background:#1a1a2a;border-radius:16px;padding:8px;margin-bottom:8px;}
        .conversation-item{padding:12px;border-bottom:1px solid var(--border-color);cursor:pointer;}
        
        .auth-container{position:fixed;inset:0;background:linear-gradient(135deg, #0a0a1a, #1a0f2e);display:flex;align-items:center;justify-content:center;z-index:10001;}
        .auth-card{background:rgba(30,30,46,0.95);backdrop-filter:blur(15px);border-radius:30px;padding:30px;width:90%;max-width:380px;text-align:center;border:1px solid rgba(0,212,255,0.3);}
        .auth-switch{margin-top:15px;color:var(--accent);cursor:pointer;}
        .loading-spinner { width:20px; height:20px; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; margin-right:5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .success-check{color:#00ff88;font-size:2rem;}
    </style>
</head>
<body>
<div id="splash" style="position:fixed; inset:0; background:linear-gradient(135deg, #0a0a1a, #1a0f2e); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:9999;">
    <div style="font-size:50px; font-weight:800; background:linear-gradient(45deg,#9b59b6,#00d4ff); -webkit-background-clip:text; background-clip:text; color:transparent;">SAM</div>
    <div style="color:var(--accent); margin-top:10px;">سوق الحسابات</div>
</div>

<div id="app" style="display:none;">
    <div class="sidebar" id="sidebar">
        <div style="font-size:20px; margin-bottom:20px; font-weight:bold;">القائمة</div>
        <button onclick="window.showPage('home')"><i class="fas fa-home"></i> الرئيسية</button>
        <button onclick="window.showAddModal()"><i class="fas fa-plus-circle"></i> إضافة حساب</button>
        <button onclick="window.showPage('messages')"><i class="fas fa-comment-dots"></i> الرسائل</button>
        <button onclick="window.showPage('support')"><i class="fas fa-headset"></i> الدعم الفني</button>
        <button onclick="window.showPage('about')"><i class="fas fa-info-circle"></i> عن التطبيق</button>
        <button id="themeToggleSide"><i class="fas fa-moon"></i> الوضع الليلي</button>
        <select id="langSelectSide" style="margin-top:10px;">
            <option value="ar">🇸🇦 العربية</option>
            <option value="en">🇺🇸 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="tr">🇹🇷 Türkçe</option>
        </select>
        <button id="logoutBtnSide"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    </div>
    
    <div class="header">
        <button class="profile-icon" id="profileIcon"><i class="fas fa-user-circle"></i></button>
        <div class="logo">سوق الحسابات</div>
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
    </div>
    
    <div id="homePage" class="page active-page">
        <h2>الحسابات المتاحة</h2>
        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="بحث...">
            <select id="platformFilter"><option value="all">الكل</option><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Snapchat</option><option>Twitter</option><option>Facebook</option></select>
        </div>
        <div id="accountsList" class="accounts-grid">جار التحميل...</div>
    </div>
    
    <div id="profilePage" class="page">
        <div class="profile-header">
            <div class="settings-icon" id="settingsIcon"><i class="fas fa-cog"></i></div>
            <h2 id="profileTitle" style="text-align:center;">الملف الشخصي</h2>
        </div>
        <div style="text-align:center;">
            <img id="avatarImg" class="profile-avatar" src="https://via.placeholder.com/80">
            <div style="background:#9b59b6; display:inline-block; padding:5px 15px; border-radius:30px; margin-top:8px; font-size:0.9rem;">ID: <span id="userId"></span></div>
            <div id="userName" style="margin-top:5px; font-size:1.1rem; font-weight:bold;"></div>
            <div id="userCountry" style="font-size:0.8rem; color:var(--text-secondary);"></div>
            
            <div class="profile-stats-container">
                <div class="profile-stats-inline">
                    <div class="profile-stat">
                        <span id="followersCount">0</span>
                        <small>متابع</small>
                    </div>
                    <div class="profile-stat">
                        <span id="followingCount">0</span>
                        <small>يتابع</small>
                    </div>
                </div>
                <div id="followButtonContainer"></div>
            </div>
        </div>
        
        <div style="margin-top:20px;">
            <h3 id="userPostsTitle">المنشورات</h3>
            <div id="userAccountsList" class="my-accounts-grid">جار التحميل...</div>
        </div>
    </div>
    
    <div id="messagesPage" class="page">
        <h2>المحادثات</h2>
        <div id="convList"></div>
        <div id="chatBox" style="display:none">
            <div id="chatMessages" class="chat-messages"></div>
            <input id="messageInput" placeholder="اكتب رسالة...">
            <button id="sendMsg" class="btn-primary">إرسال</button>
            <button id="backConv" class="btn-outline">رجوع</button>
        </div>
    </div>
    
    <div id="supportPage" class="page">
        <h2>الدعم الفني</h2>
        <form id="supportForm">
            <select id="issueType"><option>مشكلة في الشراء</option><option>مشكلة في البيع</option><option>مشكلة في الدردشة</option><option>اقتراح</option><option>أخرى</option></select>
            <textarea id="supportMsg" placeholder="اكتب مشكلتك بالتفصيل..."></textarea>
            <button type="submit" class="btn-primary">إرسال</button>
        </form>
    </div>
    
    <div id="aboutPage" class="page">
        <div style="text-align:center; padding:20px;">
            <h1>سوق الحسابات</h1>
            <p>المنصة الأولى لبيع وشراء حسابات التواصل الاجتماعي</p>
            <p style="margin-top:20px;">تم التطوير بواسطة <strong>Ameen Al-Zawahi</strong></p>
        </div>
    </div>
    
    <div class="bottom-nav">
        <button onclick="window.showPage('home')"><i class="fas fa-home"></i><span>الرئيسية</span></button>
        <button onclick="window.showAddModal()"><i class="fas fa-plus-circle"></i><span>نشر</span></button>
        <button onclick="window.showPage('messages')"><i class="fas fa-comment-dots"></i><span>الدردشات</span></button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where, orderBy, onSnapshot, increment, addDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyB3mtcnmHD-rPYxLXLFVhg6VPrNMPIetaw",
        authDomain: "selling-accounts-90d8e.firebaseapp.com",
        projectId: "selling-accounts-90d8e",
        storageBucket: "selling-accounts-90d8e.firebasestorage.app",
        messagingSenderId: "433974982968",
        appId: "1:433974982968:web:203c8ee4f0f9c7670e69cd"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const IMGBB_KEY = "a76371f79ef3069a4103d3493271efb5";
    
    async function uploadToImgBB(file) {
        const fd = new FormData(); fd.append("image", file); fd.append("key", IMGBB_KEY);
        const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (!data.success) throw new Error(data.error?.message);
        return data.data.url;
    }
    
    // ============ الترجمة ============
    const translations = {
        ar: { home: "الرئيسية", add: "إضافة حساب", messages: "الرسائل", support: "الدعم الفني", about: "عن التطبيق", dark: "الوضع الليلي", logout: "تسجيل الخروج", search: "بحث...", all: "الكل", profile: "الملف الشخصي", followers: "متابع", following: "يتابع", posts: "المنشورات", edit: "تعديل", delete: "حذف", chat: "مراسلة", details: "تفاصيل", follow: "متابعة", unfollow: "إلغاء المتابعة", settings: "الإعدادات", name: "الاسم", email: "البريد الإلكتروني", phone: "رقم الهاتف", city: "المدينة", country: "الدولة", zip: "الرمز البريدي", save: "حفظ", cancel: "إلغاء", confirm_delete: "هل أنت متأكد من الحذف؟", deleted: "تم الحذف", updated: "تم التحديث", login: "تسجيل الدخول", register: "إنشاء حساب", password: "كلمة المرور", create_account: "إنشاء حساب جديد" },
        en: { home: "Home", add: "Add Account", messages: "Messages", support: "Support", about: "About", dark: "Dark Mode", logout: "Logout", search: "Search...", all: "All", profile: "Profile", followers: "Followers", following: "Following", posts: "Posts", edit: "Edit", delete: "Delete", chat: "Chat", details: "Details", follow: "Follow", unfollow: "Unfollow", settings: "Settings", name: "Name", email: "Email", phone: "Phone", city: "City", country: "Country", zip: "Postal Code", save: "Save", cancel: "Cancel", confirm_delete: "Are you sure?", deleted: "Deleted", updated: "Updated", login: "Login", register: "Register", password: "Password", create_account: "Create Account" },
        fr: { home: "Accueil", add: "Ajouter", messages: "Messages", support: "Support", about: "À propos", dark: "Mode nuit", logout: "Déconnexion", search: "Rechercher...", all: "Tous", profile: "Profil", followers: "Abonnés", following: "Abonnements", posts: "Annonces", edit: "Modifier", delete: "Supprimer", chat: "Discuter", details: "Détails", follow: "Suivre", unfollow: "Ne plus suivre", settings: "Paramètres", name: "Nom", email: "Email", phone: "Téléphone", city: "Ville", country: "Pays", zip: "Code postal", save: "Enregistrer", cancel: "Annuler", confirm_delete: "Supprimer ?", deleted: "Supprimé", updated: "Mis à jour", login: "Connexion", register: "Inscription", password: "Mot de passe", create_account: "Créer un compte" },
        tr: { home: "Ana Sayfa", add: "Hesap Ekle", messages: "Mesajlar", support: "Destek", about: "Hakkında", dark: "Gece Modu", logout: "Çıkış", search: "Ara...", all: "Tümü", profile: "Profil", followers: "Takipçi", following: "Takip", posts: "İlanlar", edit: "Düzenle", delete: "Sil", chat: "Sohbet", details: "Detaylar", follow: "Takip Et", unfollow: "Takibi Bırak", settings: "Ayarlar", name: "İsim", email: "E-posta", phone: "Telefon", city: "Şehir", country: "Ülke", zip: "Posta kodu", save: "Kaydet", cancel: "İptal", confirm_delete: "Silmek istediğinize emin misiniz?", deleted: "Silindi", updated: "Güncellendi", login: "Giriş", register: "Kayıt Ol", password: "Şifre", create_account: "Hesap Oluştur" }
    };
    let currentLang = localStorage.getItem('lang') || 'ar';
    function t(key) { return translations[currentLang]?.[key] || translations.ar[key] || key; }
    function applyLanguage() {
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if(k) el.innerText = t(k); });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if(k) el.placeholder = t(k); });
        document.getElementById('langSelectSide').value = currentLang;
        if(window.currentPage === 'home') loadAccounts();
        else if(window.currentPage === 'profile' && window.currentProfileUserId) refreshProfilePage();
    }
    
    let currentUser = null;
    let currentProfileUserId = null;
    let currentPage = 'home';
    
    window.showPage = function(pageId) {
        currentPage = pageId;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.getElementById(pageId + 'Page').classList.add('active-page');
        document.getElementById('sidebar').classList.remove('open');
        if (pageId === 'home') loadAccounts();
        if (pageId === 'profile' && currentProfileUserId) refreshProfilePage();
        if (pageId === 'messages') loadConversations();
    };
    
    async function refreshProfilePage() {
        if (!currentProfileUserId) return;
        await loadProfileData(currentProfileUserId);
        await loadUserAccounts(currentProfileUserId);
        await loadFollowStats(currentProfileUserId);
        const isOwnProfile = (currentUser && currentProfileUserId === currentUser.uid);
        document.getElementById('profileTitle').innerText = isOwnProfile ? t('profile') : `@${document.getElementById('userName').innerText || 'مستخدم'}`;
        document.getElementById('userPostsTitle').innerText = isOwnProfile ? t('posts') : t('posts');
        const settingsIcon = document.getElementById('settingsIcon');
        if (settingsIcon) {
            if (isOwnProfile) settingsIcon.classList.remove('hidden');
            else settingsIcon.classList.add('hidden');
        }
        const avatarImg = document.getElementById('avatarImg');
        if (isOwnProfile) {
            avatarImg.classList.add('own-profile-avatar');
            avatarImg.classList.remove('other-profile-avatar');
            avatarImg.onclick = () => changeAvatar();
        } else {
            avatarImg.classList.add('other-profile-avatar');
            avatarImg.classList.remove('own-profile-avatar');
            avatarImg.onclick = null;
        }
    }
    
    async function loadProfileData(userId) {
        const userRef = doc(db, 'users', userId);
        const snap = await getDoc(userRef);
        if (snap.exists()) {
            const data = snap.data();
            document.getElementById('userId').innerText = data.userIdRandom || userId.slice(0,8);
            document.getElementById('userName').innerText = data.name || 'مستخدم';
            document.getElementById('userCountry').innerText = data.country || '';
            document.getElementById('avatarImg').src = data.avatar || 'https://via.placeholder.com/80';
        }
    }
    
    async function loadFollowStats(userId) {
        const userRef = doc(db, 'users', userId);
        const snap = await getDoc(userRef);
        const data = snap.data() || {};
        document.getElementById('followersCount').innerText = data.followers?.length || 0;
        document.getElementById('followingCount').innerText = data.following?.length || 0;
        
        const container = document.getElementById('followButtonContainer');
        if (!currentUser || userId === currentUser.uid) {
            container.innerHTML = '';
            return;
        }
        const currentUserRef = doc(db, 'users', currentUser.uid);
        const currentSnap = await getDoc(currentUserRef);
        const isFollowing = currentSnap.data()?.following?.includes(userId) || false;
        container.innerHTML = `<button class="btn-follow-green ${isFollowing ? 'unfollow' : ''}" id="followBtn">${isFollowing ? t('unfollow') : t('follow')}</button>`;
        document.getElementById('followBtn')?.addEventListener('click', async () => {
            if (isFollowing) {
                await updateDoc(currentUserRef, { following: arrayRemove(userId) });
                await updateDoc(userRef, { followers: arrayRemove(currentUser.uid) });
            } else {
                await updateDoc(currentUserRef, { following: arrayUnion(userId) });
                await updateDoc(userRef, { followers: arrayUnion(currentUser.uid) });
            }
            loadFollowStats(userId);
            loadAccounts();
        });
    }
    
    async function loadUserAccounts(userId) {
        const container = document.getElementById('userAccountsList');
        container.innerHTML = '<div class="card">جار التحميل...</div>';
        try {
            const q = query(collection(db, 'accounts'), where('sellerId', '==', userId), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            if (snap.empty) { container.innerHTML = '<div class="card">لا توجد حسابات منشورة</div>'; return; }
            const isOwner = (currentUser && currentUser.uid === userId);
            let html = '';
            snap.forEach(docSnap => {
                const acc = docSnap.data();
                html += `<div class="my-account-card">
                    <h4><i class="fab fa-${acc.platform?.toLowerCase()}"></i> ${acc.name}</h4>
                    <p>💰 ${acc.price} ${acc.currency} | 👥 ${acc.followers?.toLocaleString()}</p>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        ${isOwner ? `<button class="edit-btn btn-primary" data-id="${docSnap.id}" data-acc='${JSON.stringify(acc)}'>✏️ ${t('edit')}</button>
                        <button class="delete-btn btn-danger" data-id="${docSnap.id}">🗑️ ${t('delete')}</button>` : ''}
                        <button onclick="window.openChat('${acc.sellerId}', '${acc.name.replace(/'/g, "\\'")}')" class="btn-outline">💬 ${t('chat')}</button>
                        <button class="details-btn btn-outline" data-id="${docSnap.id}">🔍 ${t('details')}</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            const accountsMap = {};
            snap.forEach(d => accountsMap[d.id] = d.data());
            document.querySelectorAll('.details-btn').forEach(btn => { btn.onclick = () => showDetails(accountsMap[btn.dataset.id]); });
            if(isOwner) {
                document.querySelectorAll('.edit-btn').forEach(btn => { btn.onclick = () => showEditModal(btn.dataset.id, JSON.parse(btn.dataset.acc)); });
                document.querySelectorAll('.delete-btn').forEach(btn => { btn.onclick = async () => { if(confirm(t('confirm_delete'))){ await deleteDoc(doc(db, 'accounts', btn.dataset.id)); alert(t('deleted')); loadUserAccounts(userId); loadAccounts(); } }; });
            }
        } catch(e) { container.innerHTML = '<div class="card">خطأ في التحميل</div>'; }
    }
    
    async function showDetails(account) {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content">
            <h3>${account.name}</h3>
            <p>${account.platform} | 👥 ${account.followers?.toLocaleString()}</p>
            <p>💰 ${account.price} ${account.currency} | 👁️ ${account.views || 0}</p>
            <p>🔗 <a href="${account.link}" target="_blank">${account.link}</a></p>
            <p>📝 ${account.description || ''}</p>
            <button class="btn-primary" id="closeModal">${t('details')}</button>
        </div>`;
        document.body.appendChild(modal);
        modal.querySelector('#closeModal').onclick = () => modal.remove();
        await updateDoc(doc(db, 'accounts', account.id), { views: increment(1) });
    }
    
    async function showEditModal(accountId, acc) {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content">
            <h3>✏️ ${t('edit')}</h3>
            <input type="text" id="editName" value="${acc.name.replace(/"/g, '"')}" placeholder="${t('name')}">
            <input type="url" id="editLink" value="${acc.link}" placeholder="${t('link')}">
            <input type="number" id="editFollowers" value="${acc.followers}" placeholder="${t('followers')}">
            <div class="price-currency-row"><input type="number" id="editPrice" value="${acc.price}" placeholder="${t('price')}"><select id="editCurrency"><option ${acc.currency === 'ريال سعودي' ? 'selected' : ''}>ريال سعودي</option><option ${acc.currency === 'ريال يمني' ? 'selected' : ''}>ريال يمني</option><option ${acc.currency === 'دولار' ? 'selected' : ''}>دولار</option></select></div>
            <textarea id="editDesc" placeholder="${t('description')}">${acc.description || ''}</textarea>
            <div style="display:flex; gap:8px; margin-top:15px;"><button class="btn-primary" id="saveEdit">${t('save')}</button><button class="btn-outline" id="cancelEdit">${t('cancel')}</button></div>
        </div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveEdit').onclick = async () => {
            await updateDoc(doc(db, 'accounts', accountId), {
                name: modal.querySelector('#editName').value,
                link: modal.querySelector('#editLink').value,
                followers: parseInt(modal.querySelector('#editFollowers').value),
                price: parseFloat(modal.querySelector('#editPrice').value),
                currency: modal.querySelector('#editCurrency').value,
                description: modal.querySelector('#editDesc').value
            });
            alert(t('updated')); modal.remove(); loadUserAccounts(currentUser.uid); loadAccounts();
        };
        modal.querySelector('#cancelEdit').onclick = () => modal.remove();
    }
    
    async function loadAccounts() {
        const container = document.getElementById('accountsList');
        container.innerHTML = 'جار التحميل...';
        try {
            let followingIds = [];
            if (currentUser) {
                const userSnap = await getDoc(doc(db, 'users', currentUser.uid));
                followingIds = userSnap.data()?.following || [];
            }
            const q = query(collection(db, 'accounts'), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);
            let accounts = [];
            snap.forEach(d => accounts.push({ id: d.id, ...d.data() }));
            accounts.sort((a,b) => {
                const aF = followingIds.includes(a.sellerId), bF = followingIds.includes(b.sellerId);
                if(aF && !bF) return -1;
                if(!aF && bF) return 1;
                return b.createdAt - a.createdAt;
            });
            const search = document.getElementById('searchInput')?.value.toLowerCase() || "";
            const platform = document.getElementById('platformFilter')?.value || "all";
            let filtered = accounts.filter(a => (a.name?.toLowerCase().includes(search) || a.platform?.toLowerCase().includes(search)) && (platform === "all" || a.platform === platform));
            if (filtered.length === 0) { container.innerHTML = '<div>لا توجد حسابات</div>'; return; }
            let html = '';
            for (const acc of filtered) {
                let sellerName = "مستخدم", sellerAvatar = null;
                const userSnap = await getDoc(doc(db, 'users', acc.sellerId));
                if (userSnap.exists()) { sellerName = userSnap.data().name || sellerName; sellerAvatar = userSnap.data().avatar; }
                const isFollowing = followingIds.includes(acc.sellerId);
                html += `<div class="card">
                    <div style="display:flex; align-items:center; gap:10px;">
                        ${sellerAvatar ? `<img src="${sellerAvatar}" class="profile-thumb" onclick="window.viewOtherProfile('${acc.sellerId}')">` : '<div class="profile-thumb" style="background:#555; display:flex; align-items:center; justify-content:center;"><i class="fas fa-user"></i></div>'}
                        <div style="flex:1;">
                            <h3><i class="fab fa-${acc.platform?.toLowerCase()}"></i> ${acc.name} ${isFollowing ? '<span style="font-size:0.6rem;color:#2ecc71;">● يتابع</span>' : ''}</h3>
                            <p style="margin:0; cursor:pointer; color:var(--accent);" onclick="window.viewOtherProfile('${acc.sellerId}')">${sellerName}</p>
                        </div>
                    </div>
                    <p>${acc.platform} | 👥 ${acc.followers?.toLocaleString()}</p>
                    <p>💰 ${acc.price} ${acc.currency} | 👁️ ${acc.views || 0}</p>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button class="details-btn btn-primary" data-id='${acc.id}'>🔍 ${t('details')}</button>
                        <button onclick="window.openChat('${acc.sellerId}', '${sellerName.replace(/'/g, "\\'")}')" class="btn-outline">💬 ${t('chat')}</button>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
            const accountsMap = {};
            accounts.forEach(acc => accountsMap[acc.id] = acc);
            document.querySelectorAll('.details-btn').forEach(btn => { btn.onclick = () => showDetails(accountsMap[btn.dataset.id]); });
        } catch(e) { container.innerHTML = '<div>خطأ في التحميل</div>'; }
    }
    
    window.viewOtherProfile = function(userId) {
        currentProfileUserId = userId;
        refreshProfilePage();
        showPage('profile');
    };
    
    window.openChat = async function(sellerId, sellerName) {
        if (!currentUser) { alert("تسجيل الدخول مطلوب"); return; }
        if (sellerId === currentUser.uid) { alert("لا يمكن مراسلة نفسك"); return; }
        const convId = [currentUser.uid, sellerId].sort().join('_');
        const convRef = doc(db, 'conversations', convId);
        if (!(await getDoc(convRef)).exists()) await setDoc(convRef, { participants: [currentUser.uid, sellerId], createdAt: Date.now() });
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>💬 محادثة: ${sellerName}</h3><div id="chatArea" style="height:250px; overflow-y:auto; background:#1a1a2a; border-radius:16px; padding:8px; margin-bottom:8px;"></div><input type="text" id="chatInput" placeholder="${t('chat')}..." style="width:100%;"><button id="sendChatBtn" class="btn-primary" style="margin-top:8px;">${t('send')}</button><button id="closeChatBtn" class="btn-outline" style="margin-top:8px;">${t('cancel')}</button></div>`;
        document.body.appendChild(modal);
        const messagesDiv = modal.querySelector('#chatArea');
        const inputField = modal.querySelector('#chatInput');
        const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
        const unsubscribe = onSnapshot(q, (snap) => {
            messagesDiv.innerHTML = '';
            snap.forEach(msgDoc => {
                const data = msgDoc.data();
                const isMe = data.senderId === currentUser.uid;
                messagesDiv.innerHTML += `<div style="text-align:${isMe ? 'right' : 'left'}; margin:8px;"><span style="background:${isMe ? '#9b59b6' : '#2a2a4a'}; padding:8px 12px; border-radius:18px; display:inline-block;">${data.text}</span></div>`;
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        modal.querySelector('#sendChatBtn').onclick = async () => {
            const txt = inputField.value.trim();
            if(txt) { await addDoc(collection(db, 'conversations', convId, 'messages'), { text: txt, senderId: currentUser.uid, timestamp: Date.now() }); inputField.value = ''; }
        };
        modal.querySelector('#closeChatBtn').onclick = () => { unsubscribe(); modal.remove(); };
    };
    
    async function loadConversations() {
        if (!currentUser) return;
        const q = query(collection(db, 'conversations'), where('participants', 'array-contains', currentUser.uid));
        onSnapshot(q, async (snap) => {
            const container = document.getElementById('convList');
            if (snap.empty) { container.innerHTML = '<div>لا توجد محادثات</div>'; return; }
            let html = '';
            for (const docSnap of snap.docs) {
                const conv = docSnap.data();
                const otherId = conv.participants.find(id => id !== currentUser.uid);
                const userSnap = await getDoc(doc(db, 'users', otherId));
                const name = userSnap.exists() ? userSnap.data().name : otherId.slice(0,6);
                html += `<div class="conversation-item" data-convid="${docSnap.id}">💬 ${name}</div>`;
            }
            container.innerHTML = html;
            document.querySelectorAll('.conversation-item').forEach(el => { el.onclick = () => loadConversation(el.dataset.convid); });
        });
    }
    
    async function loadConversation(convId) {
        document.getElementById('convList').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
        const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp'));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('chatMessages');
            div.innerHTML = '';
            snap.forEach(msg => {
                const data = msg.data();
                const isMe = data.senderId === currentUser.uid;
                div.innerHTML += `<div style="text-align:${isMe ? 'right' : 'left'}; margin:8px;"><span style="background:${isMe ? '#9b59b6' : '#2a2a4a'}; padding:8px 12px; border-radius:18px; display:inline-block;">${data.text}</span></div>`;
            });
            div.scrollTop = div.scrollHeight;
        });
        document.getElementById('sendMsg').onclick = async () => {
            const inp = document.getElementById('messageInput');
            if(inp.value.trim()) { await addDoc(collection(db, 'conversations', convId, 'messages'), { text: inp.value.trim(), senderId: currentUser.uid, timestamp: Date.now() }); inp.value = ''; }
        };
        document.getElementById('backConv').onclick = () => { document.getElementById('chatBox').style.display = 'none'; document.getElementById('convList').style.display = 'block'; loadConversations(); };
    }
    
    window.showAddModal = function() {
        let imageFiles = [];
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>➕ ${t('add')}</h3><form id="addForm"><select id="addPlatform" required><option value="">${t('platform')}</option><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Snapchat</option><option>Twitter</option><option>Facebook</option></select><input id="addName" placeholder="${t('name')}" required><input id="addFollowers" placeholder="${t('followers')}" type="number" required><div class="price-currency-row"><input id="addPrice" placeholder="${t('price')}" type="number" required><select id="addCurrency"><option>ريال سعودي</option><option>ريال يمني</option><option>دولار</option></select></div><input id="addLink" placeholder="${t('link')}" required><textarea id="addDesc" placeholder="${t('description')}"></textarea><label>${t('images')}</label><input type="file" id="addImages" accept="image/*"><div id="preview"></div><button type="submit" class="btn-primary">${t('publish')}</button><button type="button" id="cancelAdd" class="btn-outline">${t('cancel')}</button></form></div>`;
        document.body.appendChild(modal);
        const preview = modal.querySelector('#preview');
        modal.querySelector('#addImages').onchange = (e) => {
            const file = e.target.files[0];
            if(file) { imageFiles = [file]; preview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="width:60px; height:60px; border-radius:8px;">`; }
        };
        modal.querySelector('#addForm').onsubmit = async (e) => {
            e.preventDefault();
            if(!currentUser) return alert("تسجيل الدخول مطلوب");
            if(imageFiles.length === 0) return alert("ارفع صورة واحدة على الأقل");
            const btn = modal.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = "جاري النشر...";
            try {
                const url = await uploadToImgBB(imageFiles[0]);
                await addDoc(collection(db, 'accounts'), {
                    name: modal.querySelector('#addName').value, link: modal.querySelector('#addLink').value,
                    platform: modal.querySelector('#addPlatform').value, followers: parseInt(modal.querySelector('#addFollowers').value),
                    price: parseFloat(modal.querySelector('#addPrice').value), currency: modal.querySelector('#addCurrency').value,
                    description: modal.querySelector('#addDesc').value, images: [url], sellerId: currentUser.uid,
                    views: 0, createdAt: Date.now()
                });
                alert("تم النشر بنجاح"); modal.remove(); loadAccounts(); if(currentProfileUserId === currentUser.uid) loadUserAccounts(currentUser.uid);
            } catch(err) { alert("خطأ: "+err.message); }
            finally { btn.disabled = false; btn.textContent = t('publish'); }
        };
        modal.querySelector('#cancelAdd').onclick = () => modal.remove();
    };
    
    async function changeAvatar() {
        if (!currentUser || currentProfileUserId !== currentUser.uid) { alert("لا يمكنك تغيير صورة مستخدم آخر"); return; }
        const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            try {
                const url = await uploadToImgBB(file);
                await updateDoc(doc(db, 'users', currentUser.uid), { avatar: url });
                document.getElementById('avatarImg').src = url;
                alert("تم تحديث الصورة");
            } catch(err) { alert("خطأ: "+err.message); }
        };
        input.click();
    }
    
    function showSettingsModal() {
        if (!currentUser || currentProfileUserId !== currentUser.uid) { alert("لا يمكنك تعديل إعدادات مستخدم آخر"); return; }
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><h3>⚙️ ${t('settings')}</h3><input type="text" id="setName" placeholder="${t('name')}"><input type="email" id="setEmail" placeholder="${t('email')}"><div style="display:flex; gap:8px;"><select id="setPhoneCode" style="width:35%;"><option>+966</option><option>+967</option><option>+20</option><option>+971</option><option>+962</option></select><input type="tel" id="setPhone" placeholder="${t('phone')}" style="flex:1"></div><input type="text" id="setCity" placeholder="${t('city')}"><select id="setCountry"><option value="">${t('country')}</option><option>السعودية</option><option>مصر</option><option>الإمارات</option><option>الكويت</option><option>قطر</option></select><input type="text" id="setZip" placeholder="${t('zip')}"><div style="display:flex; gap:8px; margin-top:15px;"><button class="btn-primary" id="saveSettings">${t('save')}</button><button class="btn-outline" id="closeSettings">${t('cancel')}</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveSettings').onclick = async () => {
            await updateDoc(doc(db, 'users', currentUser.uid), {
                name: modal.querySelector('#setName').value, email: modal.querySelector('#setEmail').value,
                phone: modal.querySelector('#setPhoneCode').value + ' ' + modal.querySelector('#setPhone').value,
                city: modal.querySelector('#setCity').value, country: modal.querySelector('#setCountry').value,
                zip: modal.querySelector('#setZip').value
            });
            alert(t('updated')); modal.remove(); refreshProfilePage();
        };
        modal.querySelector('#closeSettings').onclick = () => modal.remove();
    }
    
    // ============ المصادقة ============
    let authContainer = null;
    function showLoginScreen() {
        if(authContainer) authContainer.remove();
        authContainer = document.createElement('div'); authContainer.className = 'auth-container';
        authContainer.innerHTML = `<div class="auth-card"><h2>🔐 ${t('login')}</h2><input id="loginEmail" placeholder="${t('email')}"><input id="loginPassword" type="password" placeholder="${t('password')}"><button id="doLogin" class="btn-primary">${t('login')}</button><div class="auth-switch" id="toRegister">${t('create_account')}</div><div id="loginError" style="color:red; margin-top:10px;"></div></div>`;
        document.body.appendChild(authContainer);
        document.getElementById('doLogin').onclick = async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); authContainer.remove(); }
            catch(e) { document.getElementById('loginError').innerText = e.message.includes('auth/wrong-password') ? 'كلمة مرور خاطئة' : 'خطأ في البريد أو كلمة المرور'; }
        };
        document.getElementById('toRegister').onclick = () => showRegisterScreen();
    }
    
    function showRegisterScreen() {
        if(authContainer) authContainer.remove();
        authContainer = document.createElement('div'); authContainer.className = 'auth-container';
        authContainer.innerHTML = `<div class="auth-card"><h2>📝 ${t('register')}</h2><input id="regName" placeholder="${t('name')}"><input id="regEmail" placeholder="${t('email')}"><input id="regPassword" type="password" placeholder="${t('password')}"><select id="regCountry"><option value="">${t('country')}</option><option>السعودية</option><option>مصر</option><option>الإمارات</option><option>الكويت</option><option>قطر</option></select><button id="doRegister" class="btn-primary">${t('register')}</button><div class="auth-switch" id="toLogin">${t('login')}</div><div id="regError" style="color:red; margin-top:10px;"></div></div>`;
        document.body.appendChild(authContainer);
        document.getElementById('doRegister').onclick = async () => {
            const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value, pass = document.getElementById('regPassword').value, country = document.getElementById('regCountry').value;
            if(!name || !email || !pass || !country) { document.getElementById('regError').innerText = "جميع الحقول مطلوبة"; return; }
            if(pass.length < 6) { document.getElementById('regError').innerText = "كلمة المرور 6 أحرف على الأقل"; return; }
            const btn = document.getElementById('doRegister'); btn.disabled = true; btn.innerHTML = `<span class="loading-spinner"></span> جاري...`;
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(userCred.user, { displayName: name });
                await setDoc(doc(db, 'users', userCred.user.uid), { userIdRandom: Math.floor(1e9 + Math.random()*9e9), email, name, country, createdAt: Date.now(), followers: [], following: [] });
                btn.innerHTML = '<span class="success-check">✓</span> تم إنشاء الحساب';
                setTimeout(() => { authContainer.remove(); }, 1500);
            } catch(e) { btn.disabled = false; btn.innerHTML = t('register'); document.getElementById('regError').innerText = e.message.includes('auth/email-already-in-use') ? 'البريد مستخدم بالفعل' : 'خطأ في التسجيل'; }
        };
        document.getElementById('toLogin').onclick = () => showLoginScreen();
    }
    
    // ============ أحداث ============
    document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('profileIcon').onclick = () => { currentProfileUserId = currentUser?.uid; refreshProfilePage(); showPage('profile'); };
    document.getElementById('logoutBtnSide').onclick = () => signOut(auth);
    document.getElementById('themeToggleSide').onclick = () => document.body.classList.toggle('light');
    document.getElementById('searchInput')?.addEventListener('input', () => loadAccounts());
    document.getElementById('platformFilter')?.addEventListener('change', () => loadAccounts());
    document.getElementById('langSelectSide').addEventListener('change', (e) => { currentLang = e.target.value; localStorage.setItem('lang', currentLang); applyLanguage(); });
    document.getElementById('settingsIcon')?.addEventListener('click', () => showSettingsModal());
    
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const splash = document.getElementById('splash');
        const appDiv = document.getElementById('app');
        if (user) {
            splash.style.opacity = '0'; setTimeout(() => { splash.style.display = 'none'; appDiv.style.display = 'block'; }, 400);
            currentProfileUserId = user.uid;
            await refreshProfilePage();
            await loadAccounts();
            showPage('home');
            applyLanguage();
        } else {
            appDiv.style.display = 'none';
            splash.style.display = 'flex';
            setTimeout(() => { splash.style.display = 'none'; showLoginScreen(); }, 800);
        }
    });
    setTimeout(() => { if(!currentUser && document.getElementById('splash').style.display !== 'none') { document.getElementById('splash').style.display = 'none'; showLoginScreen(); } }, 2000);
</script>
